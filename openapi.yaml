  /api/action-logs/{id}/actions/{line}/exchange:
    get:
      tags: [actions]
      operationId: findExchange
      summary: Найти обмен для действия
      description: |
        Кадры и сообщения всех записей проекта во временном окне вокруг действия: от `before` мс до и до `after` мс
        после (по умолчанию 500 и 5000, не больше 600000). Всегда возвращает кадры с данными потоков; если сохранена
        интерпретация — ещё и сообщения (с категориями), чьи кадры попали в окно. Запрос и ответ различаются по
        направлению потока (`ab`, `ba`). Время действия — по журналу с учётом поправки на часы.
      parameters:
        - { $ref: '#/components/parameters/ActionLogId' }
        - { name: line, in: path, required: true, description: "Номер строки действия в файле журнала", schema: { type: integer, minimum: 1 } }
        - { name: before, in: query, description: "Окно до действия, мс", schema: { type: integer, minimum: 0, maximum: 600000, default: 500 } }
        - { name: after, in: query, description: "Окно после действия, мс", schema: { type: integer, minimum: 0, maximum: 600000, default: 5000 } }
      responses:
        '200':
          description: Обмен в окне времени
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Exchange' }
              example:
                action:
                  line: 5
                  time: '2026-10-01T00:00:02.768393000Z'
                  action: set_param
                  params: { param: setpoint, value: 21 }
                  result: { status: ok, applied: 21 }
                  resultRaw: ok;applied=21
