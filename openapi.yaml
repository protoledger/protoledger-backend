  /api/interpretation/field-hints:
    post:
      tags: [interpretation]
      operationId: getFieldTypeHints
      summary: Подсказка типа поля
      description: |
        Для целочисленного поля перебирает типы той же ширины (знаковый и беззнаковый, оба порядка байтов) и для
        каждого применяет описание к записям проекта: границы значений, число отрицательных, нарушения проверок и итог
        тестов гипотез, в которых участвует поле (в том числе с `dec()` и `response.*`). `suggested` — тип с наименьшим
        числом противоречий, если он лучше текущего; иначе `null`. Замена типа той же ширины не сдвигает соседние
        поля, поэтому годится как быстрое исправление. Поле с тем же именем и типом в других сообщениях (запрос и
        ответ) меняется вместе с этим — они перечислены в `messages`. Для поля повторяющейся группы имя —
        `<группа>.<поле>`. Это подсказка с основаниями (числа контрпримеров при каждом варианте), а не вывод.
        Без `yaml` берётся текущая ревизия. Ничего не сохраняется.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FieldHintsRequest' }
            example: { messageId: set_config_req, field: threshold_centi_c }
      responses:
        '200':
          description: Варианты типа с основаниями
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FieldHints' }
              example:
                messageId: set_config_req
                field: threshold_centi_c
                currentType: u16be
                messages: [set_config_req, config_resp]
                hypotheses: [H6, H12]
                suggested: i16be
                candidates:
                  - type: u16be
                    current: true
                    values: 40
                    min: 0
                    max: 65286
                    negative: 0
                    violations: 0
                    counterexamples: 8
                    tests:
                      - { id: H6, verdict: refuted, applicable: 24, held: 20, counterexamples: 4 }
                      - { id: H12, verdict: refuted, applicable: 38, held: 34, counterexamples: 4 }
                  - type: i16be
                    current: false
                    values: 40
                    min: -1000
                    max: 2500
                    negative: 4
                    violations: 0
                    counterexamples: 0
                    tests:
                      - { id: H6, verdict: no_counterexample, applicable: 24, held: 24, counterexamples: 0 }
                      - { id: H12, verdict: no_counterexample, applicable: 38, held: 38, counterexamples: 0 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
