                    a: { address: 192.168.1.10, port: 51234 }
                    b: { address: 192.168.1.20, port: 9000 }
                    rolesKnown: true
                    firstFrameTime: '2026-10-09T12:00:00.100000000Z'
                    lastFrameTime: '2026-10-09T12:00:05.420000000Z'
                    frameCount: 42
                    close: fin
                    flags: [retransmissions]
                    flagCounts: { retransmissions: 14 }
                    streams:
                      - id: 3f5a1c0d:c0001:ab
                        direction: a_to_b
                        length: 310
                        dataBytes: 310
                        gapBytes: 0
                        ambiguousBytes: 0
                        startAvailable: true
                      - id: 3f5a1c0d:c0001:ba
                        direction: b_to_a
                        length: 1480
                        dataBytes: 1400
                        gapBytes: 80
                        ambiguousBytes: 0
                        startAvailable: true
                total: 1
                limit: 50
                offset: 0
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/NoProject' }

  /api/streams/{stream}/bytes:
    get:
      tags: [explore]
      operationId: getStreamBytes
      summary: Байты направленного потока и карта сегментов
      description: |
        Диапазон `[from, from+len)` потока. Ответ — список участков карты, обрезанных по диапазону:
        `data` — байты есть (base64), `gap` — данных нет в записи (байтов нет, нули не подставляются),
        `ambiguous` — перекрытие с разными байтами (`data` — вариант по политике проекта,
        `variants` — все варианты). Диапазон за концом потока усекается, `length` в ответе — фактическая
        длина. Максимум `len` — 1 МиБ, больше — `400`.
      parameters:
        - name: stream
          in: path
          required: true
          description: Идентификатор направленного потока
          schema: { type: string, example: '3f5a1c0d:c0001:ab' }
        - name: from
          in: query
          description: Смещение начала диапазона
          schema: { type: integer, minimum: 0, default: 0 }
        - name: len
          in: query
          description: Длина диапазона в байтах
          schema: { type: integer, minimum: 1, maximum: 1048576, default: 4096 }
      responses:
        '200':
          description: Байты и карта сегментов
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StreamBytes' }
              example:
                stream: 3f5a1c0d:c0001:ba
                from: 0
                length: 24
                streamLength: 1480
                segments:
                  - start: 0
                    end: 16
                    status: data
                    data: qlUAEAABAAAAAAAIAAAAAA==
                    frames:
                      - { source: 3f5a1c0d9e8b7a6f5e4d3c2b1a09f8e7d6c5b4a39281706f5e4d3c2b1a0f9e8d, frameNo: 7, duplicate: false }
                  - start: 16
                    end: 24
                    status: gap
                    data: null
                    frames: []
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/NoProject' }

  /api/frames/{source}/{frameNo}:
    get:
      tags: [explore]
      operationId: getFrame
      summary: Кадр записи
      description: |
        Номера кадров — с 1, как в Wireshark. Ответ содержит байты кадра целиком, разобранные заголовки
        и, если payload попал в поток, ссылку на участок потока (переход «кадр → байты»).
      parameters:
        - name: source
          in: path
          required: true
          description: sha256 записи
          schema: { $ref: '#/components/schemas/Sha256' }
        - name: frameNo
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Кадр
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Frame' }
              example:
                source: 3f5a1c0d9e8b7a6f5e4d3c2b1a09f8e7d6c5b4a39281706f5e4d3c2b1a0f9e8d
                frameNo: 7
                time: '2026-10-09T12:00:00.250000000Z'
                fileOffset: 1024
                capturedLength: 70
                originalLength: 70
                data: AAECAwQFBgcICQoLDA0ODw==
                ethernet: { src: '00:11:22:33:44:55', dst: '66:77:88:99:aa:bb', etherType: 2048 }
                ipv4: { src: 192.168.1.20, dst: 192.168.1.10, ttl: 64, protocol: 6, headerLength: 20 }
                tcp:
                  srcPort: 9000
                  dstPort: 51234
                  seq: 1000
                  ack: 311
                  flags: [ack, psh]
                  window: 502
                  headerLength: 32
                  checksum: ok
                payload: { offset: 66, length: 4 }
                streamRange: { stream: '3f5a1c0d:c0001:ba', start: 0, end: 4, duplicate: false }
                diagnostics: []
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/NoProject' }

  /api/reports:
    post:
      tags: [reports]
      operationId: createReport
      summary: Сформировать отчёт по проекту
      description: |
        Отчёт — основания выводов, область применимости (записи, их sha256, диагностика), результат прогона,
        контрпримеры, гипотезы со статусом и результатом теста, наблюдения и открытые вопросы. Без `runId` берётся
        последний сохранённый прогон. Устаревший прогон помечается в тексте. Текст приходит строкой в JSON, чтобы
        браузер не показывал HTML как страницу: фронт сохраняет его файлом (`fileName`) или показывает как текст.
        HTML отчёта самодостаточен: всё экранировано, скриптов и внешних ресурсов нет, CSP в `<meta>`.
        Совпадает с командой `protoledger report`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReportRequest' }
            example: { format: md, runId: run-0002 }
      responses:
        '200':
          description: Отчёт
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Report' }
              example:
                format: md
                fileName: report.md
                content: "# Отчёт по проекту «demo»\n\nВерсия движка 0.1.0. ..."
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/NoProject' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMedia' }

  /api/analysis/framing:
    post:
      tags: [analysis]
      operationId: findFraming
      summary: Подсказки по границам сообщений
      description: |
        По байтам указанных направленных потоков ищет, где проходят границы сообщений: кандидаты поля длины
        (смещение, ширина 1/2/4, порядок байтов, поправка), фиксированный размер, начальные сигнатуры и разделители.
        Это **подсказки с основаниями**, не выводы: у каждой — доля подтверждений, число сообщений, первый контрпример.
        У каждого кандидата есть `framing` в виде, который принимает интерпретация (`status: hypothesis`).
        Поле длины подтверждается не меньше чем восемью сообщениями, а начала сообщений должны быть похожи друг на друга
        или совпадать с началами TCP-сегментов; иначе кандидат не показывается. Дыры не заполняются: разбор идёт по
        непрерывным участкам. Анализируется не больше 1 МиБ на поток и 16 МиБ на запрос; если часть данных отброшена,
        `truncated: true`; если поиск прерван по времени (20 с), `incomplete: true`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FramingRequest' }
            example: { streams: ['3f5a1c0d:c0001:ab', '3f5a1c0d:c0001:ba'] }
      responses:
        '200':
          description: Кандидаты границ, лучшие первыми
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FramingHints' }
              example:
                streams: ['3f5a1c0d:c0001:ab', '3f5a1c0d:c0001:ba']
                sampledBytes: 61586
                truncated: false
                incomplete: false
                length:
                  - at: 4
                    width: 2
                    bigEndian: false
                    adjust: 7
                    messages: 64
                    coveredBytes: 61586
                    totalBytes: 61586
                    scorePermille: 1000
                    streamsConfirmed: 2
                    streamsTotal: 2
                    streamsEndedExactly: 2
                    startCoherencePermille: 1000
                    segmentAlignmentPermille: 312
                    distinctValues: 18
                    minLength: 8
                    maxLength: 1472
                    firstCounterexample: null
                    equivalent: [{ at: 4, type: u8, adjust: 7 }]
                    framing: { kind: length_prefixed, length: { at: 4, type: u16le, adjust: 7 }, status: hypothesis }
                fixed: []
                signatures:
                  - { bytes: 5ac3, basis: segments, atStarts: 64, startsTotal: 64, occurrences: 64, framing: { kind: magic, bytes: 5ac3, status: hypothesis } }
                delimiters: []
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/NoProject' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMedia' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /api/analysis/variability:
    post:
      tags: [analysis]
      operationId: getVariability
      summary: Какие байты сообщений постоянны, какие меняются
      description: |
        Выравнивает сообщения по началу и для каждого смещения считает число разных значений, энтропию и частые значения;
        постоянные и меняющиеся области подряд идущих смещений; похожие на счётчик поля (значение растёт на 1 от
        сообщения к сообщению). Берутся сообщения одной длины: `length` или самой частой. Границы сообщений — из
        `framing` (например, кандидат из `/api/analysis/framing`) или из сохранённой интерпретации. Фильтр
        `messageId` оставляет сообщения одного типа и требует сохранённой интерпретации. Подсказки, не выводы.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VariabilityRequest' }
            example:
              streams: ['3f5a1c0d:c0001:ab']
              framing: { kind: length_prefixed, length: { at: 4, type: u16le, adjust: 7 }, status: hypothesis }
      responses:
        '200':
          description: Изменчивость по смещениям
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Variability' }
              example:
                messages: 32
                truncated: false
                classes: [{ length: 13, count: 12 }, { length: 15, count: 8 }]
                length: 13
                analysed: 12
                columns:
                  - { offset: 0, samples: 12, distinct: 1, entropyMillibits: 0, constant: 90, top: [{ value: 90, count: 12 }] }
                  - { offset: 1, samples: 12, distinct: 1, entropyMillibits: 0, constant: 195, top: [{ value: 195, count: 12 }] }
                regions:
                  - { start: 0, end: 2, kind: constant, bytes: 5ac3 }
                  - { start: 2, end: 6, kind: varying }
                counters: [{ at: 3, width: 1, bigEndian: true, steps: 11, pairs: 11 }]
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/NoProject' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMedia' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /api/analysis/correlations:
    post:
      tags: [analysis]
      operationId: findCorrelations
      summary: Связи байтов сообщений с действиями из журнала
      description: |
        Каждому сообщению указанных потоков подбирается действие из журнала (по порядку внутри окна `windowMs`
        от времени первого кадра сообщения, по умолчанию 2000 мс; журнал — `logId` или все журналы проекта).
        Дальше ищутся два вида связей. **`values`**: поле (смещение, тип: u8/i8/u16/i16/u32/i32, оба порядка байтов),
        значение которого равно числовому параметру или результату действия (`params.value`, `result.applied`),
        в том числе с фиксированной точкой (`scale`: 1, 10, 100, 1000). Показываются связи с долей совпадений не ниже
        80 % и не меньше чем на пяти сообщениях; постоянный параметр ни с чем не связывается. **`actions`**: смещение,
        где значение — код действия (у разных действий разные значения, у одного — почти всегда одно). Это подсказки:
        совпадение на примерах не доказывает связь, у каждой есть число примеров и первый контрпример.
        Границы сообщений — из `framing` либо из сохранённой интерпретации; `messageId` оставляет сообщения одного
        типа (нужна интерпретация). Без журнала действий — `409`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CorrelationsRequest' }
            example: { streams: ['3f5a1c0d:c0001:ab'], messageId: set_param_req }
      responses:
        '200':
          description: Найденные связи
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Correlations' }
              example:
                samples: 6
                withAction: 6
                truncated: false
                values:
                  - param: params.value
                    at: 8
                    type: i32be
                    scale: 1
                    matches: 6
                    samples: 6
                    sharePermille: 1000
                    firstCounterexample: null
                    equivalent: []
                actions:
                  - at: 2
                    type: u8
                    purityPermille: 1000
                    samples: 12
                    codes:
                      - { action: read_param, value: 1, count: 6, of: 6 }
                      - { action: set_param, value: 2, count: 6, of: 6 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/NoProject' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMedia' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /api/exchanges:
    post:
      tags: [analysis]
      operationId: findExchanges
      summary: Пары запрос→ответ в соединении
      description: |
        Сообщения соединения по обоим направлениям упорядочиваются по времени первого кадра; подряд идущие сообщения
        одной стороны образуют «ход», ход запросов (от инициатора) сопоставляется со следующим ходом ответов.
        `certainty`: `certain` — один запрос и один ответ; `ordered` — запросов и ответов поровну, сопоставлены по порядку
        (конвейер, порядок — допущение); `ambiguous` — число разное, чей ответ — неизвестно; `unanswered` — запрос без
        ответа; `unsolicited` — ответ без запроса. Границы сообщений — из `framing` либо из сохранённой интерпретации
        (без `framing` и без интерпретации — `409`); типы сообщений берутся из интерпретации, если она есть.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExchangesRequest' }
            example: { connection: '3f5a1c0d:c0001', limit: 50, offset: 0 }
      responses:
        '200':
          description: Страница обменов в порядке времени
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExchangePairPage' }
              example:
                items:
                  - requests: [{ stream: '3f5a1c0d:c0001:ab', start: 0, end: 13, messageId: set_param_req, firstTsNs: 1790899200000000000, lastTsNs: 1790899200000000000 }]
                    responses: [{ stream: '3f5a1c0d:c0001:ba', start: 0, end: 12, messageId: set_param_resp, firstTsNs: 1790899200001200000, lastTsNs: 1790899200001200000 }]
                    delayNs: 1200000
                    certainty: certain
                total: 12
                limit: 50
                offset: 0
                stats: { exchanges: 12, certain: 8, ordered: 4, ambiguous: 0, unanswered: 0, unsolicited: 0, minDelayNs: 900000, medianDelayNs: 1200000, maxDelayNs: 4100000 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/NoProject' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMedia' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /api/jobs:
    get:
      tags: [jobs]
      operationId: listJobs
      summary: Задачи текущей сессии
      responses:
        '200':
          description: Задачи, новые первыми
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Job' }
              example:
                items:
                  - id: job-0001
                    kind: import
                    state: running
                    progress: { stage: reassembling, done: 600, total: 1203, unit: frames }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/jobs/{id}:
    get:
      tags: [jobs]
      operationId: getJob
      summary: Состояние задачи
      parameters:
        - { $ref: '#/components/parameters/JobId' }
      responses:
        '200':
          description: Задача
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
              example:
                id: job-0001
                kind: import
                state: succeeded
                progress: { stage: done, done: 1203, total: 1203, unit: frames }
                result: { sourceSha256: 3f5a1c0d9e8b7a6f5e4d3c2b1a09f8e7d6c5b4a39281706f5e4d3c2b1a0f9e8d, importId: imp-0001 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [jobs]
      operationId: cancelJob
      summary: Отменить задачу
      description: |
        Запрос отмены; задача останавливается на ближайшей проверке токена отмены и переходит в `cancelled`.
        Уже завершённая задача — `409`. Частичные результаты отменённого импорта удаляются.
      parameters:
        - { $ref: '#/components/parameters/JobId' }
      responses:
        '202':
          description: Отмена запрошена
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
              example:
                id: job-0001
                kind: import
                state: cancelling
                progress: { stage: reassembling, done: 600, total: 1203, unit: frames }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/jobs/{id}/events:
    get:
      tags: [jobs]
      operationId: streamJobEvents
      summary: Прогресс задачи (SSE)
      description: |
        `text/event-stream`. Первым событием приходит текущее состояние. События: `progress`
        (данные — `{jobId, stage, done, total, unit}`), `state` (данные — `Job`, при смене состояния),
        поток закрывается после терминального состояния. Для завершённой задачи — одно событие `state`
        и закрытие. Заголовок токена в `EventSource` не передать, поэтому клиент использует
        `fetch` со стримом.
      parameters:
        - { $ref: '#/components/parameters/JobId' }
      responses:
        '200':
          description: Поток событий
          content:
            text/event-stream:
              schema: { type: string }
              example: |
                event: progress
                data: {"jobId":"job-0001","stage":"reassembling","done":600,"total":1203,"unit":"frames"}

                event: state
                data: {"id":"job-0001","kind":"import","state":"succeeded","progress":{"stage":"done","done":1203,"total":1203,"unit":"frames"},"result":{"sourceSha256":"3f5a1c0d9e8b7a6f5e4d3c2b1a09f8e7d6c5b4a39281706f5e4d3c2b1a0f9e8d","importId":"imp-0001"}}
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    sessionToken:
      type: apiKey
      in: header
      name: X-Protoledger-Token
      description: Токен сессии (256 бит), выдаётся встроенной SPA через `<meta name="protoledger-token">`

  parameters:
    Limit:
      name: limit
      in: query
      description: Размер страницы
      schema: { type: integer, minimum: 1, maximum: 500, default: 50 }
    Offset:
      name: offset
      in: query
      description: Сколько элементов пропустить
      schema: { type: integer, minimum: 0, default: 0 }
    SourceSha:
      name: sha256
      in: path
      required: true
      description: sha256 записи
      schema: { $ref: '#/components/schemas/Sha256' }
    RunId:
      name: id
      in: path
      required: true
      description: Идентификатор прогона
      schema: { type: string, example: run-0001 }
    ActionLogId:
      name: id
      in: path
      required: true
      description: Идентификатор журнала
      schema: { type: string, example: log-0001 }
    JobId:
      name: id
      in: path
      required: true
      description: Идентификатор задачи
      schema: { type: string, example: job-0001 }

  responses:
    BadRequest:
      description: Некорректный запрос (параметры, тело, путь вне допустимого)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: urn:protoledger:problem:bad-request
            title: Некорректный запрос
            status: 400
            detail: Параметр len должен быть от 1 до 1048576.
    Unauthorized:
      description: Нет или неверный токен сессии
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: urn:protoledger:problem:unauthorized
            title: Нет доступа
            status: 401
            detail: Не передан или неверен заголовок X-Protoledger-Token.
    Forbidden:
      description: Чужой Host или Origin
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: urn:protoledger:problem:forbidden
            title: Запрос отклонён
            status: 403
            detail: Заголовок Host не совпадает с адресом движка.
    NotFound:
      description: Объект не найден
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: urn:protoledger:problem:not-found
            title: Не найдено
            status: 404
            detail: Поток 3f5a1c0d:c0009:ab не существует.
    NoProject:
      description: Проект не открыт
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: urn:protoledger:problem:no-project
            title: Проект не открыт
            status: 409
            detail: Сначала создайте или откройте проект (POST /api/project).
    Conflict:
      description: Конфликт состояния (задача уже завершена, у проекта идут задачи)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: urn:protoledger:problem:conflict
            title: Конфликт состояния
            status: 409
            detail: Задача job-0001 уже завершена.
    TooLarge:
      description: Тело запроса или файл больше защитного предела
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: urn:protoledger:problem:limit-exceeded
            title: Превышен предел
            status: 413
            detail: Размер файла 2 ГиБ больше предела 1 ГиБ.
            limit: { name: max_source_size, value: 1073741824, unit: bytes }
    UnsupportedMedia:
      description: Недопустимый тип содержимого запроса
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: urn:protoledger:problem:unsupported-media
            title: Неподдерживаемый тип
            status: 415
            detail: Ожидается application/json или multipart/form-data.
    Unprocessable:
      description: Запрос разобран, но объект не принят (не проект, не запись, формат не поддерживается)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: urn:protoledger:problem:unprocessable
            title: Файл не принят
            status: 422
            detail: Файл не похож на PCAP или PCAPNG.
    TooManyJobs:
      description: Достигнут предел одновременных долгих задач
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: urn:protoledger:problem:too-many-jobs
            title: Слишком много задач
            status: 429
            detail: Одновременно можно выполнять не больше 2 задач, дождитесь завершения.
            limit: { name: max_concurrent_jobs, value: 2, unit: jobs }

  schemas:
    Sha256:
      type: string
      pattern: '^[0-9a-f]{64}$'
      description: sha256 содержимого, строчные hex-цифры
      example: 3f5a1c0d9e8b7a6f5e4d3c2b1a09f8e7d6c5b4a39281706f5e4d3c2b1a0f9e8d

    Problem:
      type: object
      description: RFC 9457 Problem Details
      required: [type, title, status]
      properties:
        type: { type: string, description: 'Идентификатор вида ошибки, `urn:protoledger:problem:<код>`' }
        title: { type: string, description: Краткое название по-русски }
        status: { type: integer }
        detail: { type: string, description: "Что произошло и что делать, по-русски" }
        limit:
          type: object
          description: Только для превышения предела
          required: [name, value, unit]
          properties:
            name: { type: string, description: Имя предела из docs/limits.md }
            value: { type: integer }
            unit: { type: string }

    Health:
      type: object
      required: [status, version]
      properties:
        status: { type: string, enum: [ok] }
        version: { type: string }

    ProjectSettings:
      type: object
      description: Настройки сборки потоков; часть воспроизводимости проекта
      required: [overlapPolicy, checksumPolicy]
      properties:
        overlapPolicy:
          type: string
          enum: [first, last, flag]
          description: Какие байты брать при перекрытии с различающимся содержимым
        checksumPolicy:
          type: string
          enum: [ignore, warn, drop]
          description: Что делать с кадрами с неверной контрольной суммой TCP

    InterpretationDoc:
      type: object
      required: [rev, digest, yaml]
      properties:
        rev: { type: integer, minimum: 1 }
        digest: { $ref: '#/components/schemas/Sha256' }
        yaml: { type: string, description: "Текст интерпретации, формат protoledger/interpretation@1" }

    InterpretationRevision:
      type: object
      required: [rev, digest]
      properties:
        rev: { type: integer, minimum: 1 }
        digest: { $ref: '#/components/schemas/Sha256' }

    InterpretationRevisionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/InterpretationRevision' }

    SaveInterpretationRequest:
      type: object
      required: [yaml]
      additionalProperties: false
      properties:
        yaml: { type: string, maxLength: 4194304 }

    SaveInterpretationResult:
      type: object
      required: [rev, digest, created]
      properties:
        rev: { type: integer, minimum: 1 }
        digest: { $ref: '#/components/schemas/Sha256' }
        created: { type: boolean, description: 'false — каноническая форма не изменилась, новой ревизии нет' }

    ResultCategory:
      type: string
      enum: [matched, violated, incomplete, ambiguous, unmatched, limit_exceeded]
      description: |
        `matched` — сообщение выделено, тип найден, поля разобраны, проверки прошли; `violated` — нарушено правило
        или ожидание; `incomplete` — задевает дыру или обрывается в конце потока; `ambiguous` — задевает
        неоднозначный участок; `unmatched` — ни одно описание не подошло; `limit_exceeded` — ограничение
        реализации (заявленная длина больше предела).

    PreviewRequest:
      type: object
      required: [stream]
      additionalProperties: false
      properties:
        stream: { type: string, description: Идентификатор направленного потока }
        yaml: { type: string, description: 'Текст интерпретации; без него — последняя сохранённая ревизия' }
        category: { $ref: '#/components/schemas/ResultCategory' }
        limit: { type: integer, minimum: 1, maximum: 500, default: 100 }
        offset: { type: integer, minimum: 0, default: 0 }

    PreviewField:
      type: object
      required: [name, at, len, status, hypothesis, state, valueType, value]
      properties:
        name: { type: string }
        at: { type: integer, minimum: 0, description: Смещение поля в потоке }
        len: { type: integer, minimum: 0 }
        status: { type: string, enum: [rule, hypothesis, unknown] }
        hypothesis: { type: [string, 'null'] }
        state: { type: string, enum: [decoded, unknown, gap, ambiguous, out_of_message] }
        valueType: { type: [string, 'null'], enum: [int, bool, string, bytes, null] }
        value:
          description: Число, логическое, строка; байты — hex-строка; null, если поле не прочитано
          oneOf:
            - { type: integer }
            - { type: boolean }
            - { type: string }
            - { type: 'null' }

    PreviewViolation:
      type: object
      required: [kind, id, detail, status]
      properties:
        kind: { type: string, enum: [framing, expect, check, field_range] }
        id: { type: string, description: Поле или проверка }
        detail: { type: string }
        status: { type: string, enum: [rule, hypothesis, unknown] }

    PreviewMessage:
      type: object
      required: [start, end, category, messageId, unknownBytes, fields, violations]
      properties:
        start: { type: integer, minimum: 0 }
        end: { type: integer, minimum: 0 }
        category: { $ref: '#/components/schemas/ResultCategory' }
        messageId: { type: [string, 'null'] }
        unknownBytes: { type: integer, minimum: 0 }
        fields:
          type: array
          items: { $ref: '#/components/schemas/PreviewField' }
        violations:
          type: array
          items: { $ref: '#/components/schemas/PreviewViolation' }

    PreviewPage:
      type: object
      required: [rev, digest, outOfScope, counts, unknownBytes, items, total, limit, offset]
      properties:
        rev: { type: [integer, 'null'], description: "Номер ревизии, если применялась сохранённая" }
        digest: { $ref: '#/components/schemas/Sha256' }
        outOfScope: { type: boolean, description: "Поток вне области применимости, сообщения не разбирались" }
        counts:
          type: object
          description: Число сообщений по категориям (до фильтра)
          additionalProperties: { type: integer, minimum: 0 }
        unknownBytes: { type: integer, minimum: 0 }
        items:
          type: array
          items: { $ref: '#/components/schemas/PreviewMessage' }
        total: { type: integer, minimum: 0, description: Сообщений с учётом фильтра }
        limit: { type: integer }
        offset: { type: integer }

    CorpusFilter:
      type: object
      additionalProperties: false
      description: Что именно проверялось; пусто — все потоки всех записей
      properties:
        sources:
          type: [array, 'null']
          items: { $ref: '#/components/schemas/Sha256' }
        direction: { type: [string, 'null'], enum: [a_to_b, b_to_a, null] }
        port: { type: [integer, 'null'], minimum: 0, maximum: 65535, description: Порт любой из сторон }

    StartRunRequest:
      type: object
      additionalProperties: false
      properties:
        corpus: { $ref: '#/components/schemas/CorpusFilter' }
        revision: { type: [integer, 'null'], minimum: 1, description: Ревизия интерпретации; без значения — последняя }

    StaleReason:
      type: string
      enum: [interpretation, settings, sources]
      description: Почему прогон устарел — интерпретацию или настройки сборки изменили, записи пропали из проекта

    RunSummary:
      type: object
      required: [streams, outOfScopeStreams, messages, messageBytes, unknownBytes, counts, byMessage, counterexamples, counterexamplesTruncated]
      properties:
        streams: { type: integer, minimum: 0 }
        outOfScopeStreams: { type: integer, minimum: 0 }
        messages: { type: integer, minimum: 0 }
        messageBytes: { type: integer, minimum: 0 }
        unknownBytes: { type: integer, minimum: 0, description: Байты вне описанных полей и в зонах unknown }
        counts:
          type: object
          additionalProperties: { type: integer, minimum: 0 }
        byMessage:
          type: object
          description: Разбивка по типам сообщений; `?` — тип не определён
          additionalProperties:
            type: object
            additionalProperties: { type: integer, minimum: 0 }
        counterexamples: { type: integer, minimum: 0 }
        counterexamplesTruncated: { type: boolean, description: В списке не все контрпримеры (хранится до 1000) }

    RunHead:
      type: object
      required: [id, revision, interpretationDigest, settingsDigest, corpus, sources, engineVersion, summary, stale, staleReasons]
      properties:
        id: { type: string }
        revision: { type: [integer, 'null'] }
        interpretationDigest: { $ref: '#/components/schemas/Sha256' }
        settingsDigest: { $ref: '#/components/schemas/Sha256' }
        corpus: { $ref: '#/components/schemas/CorpusFilter' }
        sources:
          type: array
          items: { $ref: '#/components/schemas/Sha256' }
        engineVersion: { type: string }
        summary: { $ref: '#/components/schemas/RunSummary' }
        stale: { type: boolean }
        staleReasons:
          type: array
          items: { $ref: '#/components/schemas/StaleReason' }

    RunPage:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/RunHead' }
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }

    Anchor:
      type: object
      description: Стабильная ссылка на байты записи
      required: [source, stream, start, end, sha256]
      properties:
        source: { $ref: '#/components/schemas/Sha256' }
        stream: { type: string }
        start: { type: integer, minimum: 0 }
        end: { type: integer, minimum: 0 }
        sha256: { type: [string, 'null'], description: 'sha256 байтов; null, если в них есть дыра или неоднозначность' }

    Counterexample:
      type: object
      required: [anchor, category, messageId, violations]
      properties:
        anchor: { $ref: '#/components/schemas/Anchor' }
        category: { $ref: '#/components/schemas/ResultCategory' }
        messageId: { type: [string, 'null'] }
        violations:
          type: array
          items: { $ref: '#/components/schemas/PreviewViolation' }

    RunStream:
      type: object
      required: [id, source, outOfScope, counts, unknownBytes, messageBytes, messages]
      properties:
        id: { type: string }
        source: { $ref: '#/components/schemas/Sha256' }
        outOfScope: { type: boolean }
        counts:
          type: object
          additionalProperties: { type: integer, minimum: 0 }
        unknownBytes: { type: integer, minimum: 0 }
        messageBytes: { type: integer, minimum: 0 }
        messages: { type: integer, minimum: 0 }

    RunDetail:
      allOf:
        - $ref: '#/components/schemas/RunHead'
        - type: object
          required: [streams, counterexamples]
          properties:
            streams:
              type: array
              items: { $ref: '#/components/schemas/RunStream' }
            counterexamples:
              type: array
              items: { $ref: '#/components/schemas/Counterexample' }

    RunItem:
      type: object
      required: [stream, start, end, category, messageId]
      properties:
        stream: { type: string }
        start: { type: integer, minimum: 0 }
        end: { type: integer, minimum: 0 }
        category: { $ref: '#/components/schemas/ResultCategory' }
        messageId: { type: [string, 'null'] }

    RunItemPage:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/RunItem' }
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }

    ChangeKind:
      type: string
      enum: [fixed, regressed, changed, added, removed]

    RunChange:
      type: object
      required: [stream, start, end, kind, from, to, messageId]
      properties:
        stream: { type: string }
        start: { type: integer, minimum: 0 }
        end: { type: integer, minimum: 0 }
        kind: { $ref: '#/components/schemas/ChangeKind' }
        from: { oneOf: [{ $ref: '#/components/schemas/ResultCategory' }, { type: 'null' }] }
        to: { oneOf: [{ $ref: '#/components/schemas/ResultCategory' }, { type: 'null' }] }
        messageId: { type: [string, 'null'] }

    RunDiffPage:
      type: object
      required: [a, b, staleA, staleB, totals, countsA, countsB, items, total, limit, offset]
      properties:
        a: { type: string }
        b: { type: string }
        staleA: { type: boolean }
        staleB: { type: boolean }
        totals:
          type: object
          required: [fixed, regressed, changed, added, removed, unchanged]
          properties:
            fixed: { type: integer }
            regressed: { type: integer }
            changed: { type: integer }
            added: { type: integer }
            removed: { type: integer }
            unchanged: { type: integer }
        countsA:
          type: object
          additionalProperties: { type: integer }
        countsB:
          type: object
          additionalProperties: { type: integer }
        items:
          type: array
          items: { $ref: '#/components/schemas/RunChange' }
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }

    ActionLogMapping:
      type: object
      required: [time, action]
      additionalProperties: false
      properties:
        time: { type: string, description: Колонка со временем }
        action: { type: string, description: Колонка с названием действия }
        params: { type: [string, 'null'], description: Колонка с параметрами }
        result: { type: [string, 'null'], description: Колонка с результатом }
        timeFormat: { type: string, enum: [rfc3339, unix_seconds, unix_millis, unix_micros, unix_nanos], default: rfc3339 }
        paramsFormat: { type: string, enum: [kv, json], default: kv }
        resultFormat: { type: string, enum: [kv, json], default: kv }
        delimiter: { type: [string, 'null'], description: 'Разделитель, по умолчанию запятая; tab — табуляция' }
        utcOffsetMinutes: { type: integer, default: 0, description: Пояс для времени без указания пояса }
        clockOffsetMs: { type: integer, default: 0, description: "Поправка на сдвиг часов клиента, мс" }

    ImportActionLogRequest:
      type: object
      required: [path, mapping]
      additionalProperties: false
      properties:
        path: { type: string, description: Путь к файлу журнала на диске }
        mapping: { $ref: '#/components/schemas/ActionLogMapping' }

    ActionLogRowError:
      type: object
      required: [line, why]
      properties:
        line: { type: integer, minimum: 1 }
        why: { type: string }

    ActionLog:
      type: object
      required: [id, sha256, name, rows, skipped, errors, mapping, firstTime, lastTime]
      properties:
        id: { type: string }
        sha256: { $ref: '#/components/schemas/Sha256' }
        name: { type: string }
        rows: { type: integer, minimum: 0, description: Разобрано действий }
        skipped: { type: integer, minimum: 0, description: Строк не разобрано }
        errors:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/ActionLogRowError' }
        mapping: { $ref: '#/components/schemas/ActionLogMapping' }
        firstTime: { type: [string, 'null'], format: date-time }
        lastTime: { type: [string, 'null'], format: date-time }

    ActionLogList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ActionLog' }

    Action:
      type: object
      required: [line, time, action, params, result, resultRaw]
      properties:
        line: { type: integer, minimum: 1, description: Номер строки файла журнала (идентичность действия вместе с журналом) }
        time: { type: string, format: date-time }
        action: { type: string }
        params:
          type: object
          additionalProperties:
            oneOf: [{ type: integer }, { type: string }]
        result:
          type: object
          description: Пары из колонки результата; слово без значения — status
          additionalProperties:
            oneOf: [{ type: integer }, { type: string }]
        resultRaw: { type: string }

    ActionPage:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Action' }
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }

    ExchangeFrame:
      type: object
      required: [source, stream, frameNo, time, start, end, duplicate]
      properties:
        source: { $ref: '#/components/schemas/Sha256' }
        stream: { type: string }
        frameNo: { type: integer, minimum: 1 }
        time: { type: string, format: date-time }
        start: { type: integer, minimum: 0 }
        end: { type: integer, minimum: 0 }
        duplicate: { type: boolean }

    ExchangeMessage:
      type: object
      required: [source, stream, start, end, category, messageId, firstTime, lastTime]
      properties:
        source: { $ref: '#/components/schemas/Sha256' }
        stream: { type: string }
        start: { type: integer, minimum: 0 }
        end: { type: integer, minimum: 0 }
        category: { $ref: '#/components/schemas/ResultCategory' }
        messageId: { type: [string, 'null'] }
        firstTime: { type: string, format: date-time }
        lastTime: { type: string, format: date-time }

    Exchange:
      type: object
      required: [action, window, interpretationApplied, frames, messages]
      properties:
        action: { $ref: '#/components/schemas/Action' }
        window:
          type: object
          required: [from, to]
          properties:
            from: { type: string, format: date-time }
            to: { type: string, format: date-time }
        interpretationApplied: { type: boolean }
        frames:
          type: array
          items: { $ref: '#/components/schemas/ExchangeFrame' }
        messages:
          type: array
          items: { $ref: '#/components/schemas/ExchangeMessage' }

    AnchorInput:
      type: object
      required: [source, stream, start, end]
      additionalProperties: false
      properties:
        source: { $ref: '#/components/schemas/Sha256' }
        stream: { type: string }
        start: { type: integer, minimum: 0 }
        end: { type: integer, minimum: 1 }

    ObservationAnchor:
      allOf:
        - $ref: '#/components/schemas/Anchor'

    Observation:
      type: object
      required: [id, anchor, comment, anchorState]
      properties:
        id: { type: string, example: obs-1 }
        anchor: { $ref: '#/components/schemas/ObservationAnchor' }
        comment: { type: string }
        anchorState: { type: string, enum: [ok, broken, unavailable] }

    ObservationList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Observation' }

    NewObservation:
      type: object
      required: [anchor, comment]
      additionalProperties: false
      properties:
        anchor: { $ref: '#/components/schemas/AnchorInput' }
        comment: { type: string, minLength: 1, maxLength: 10000 }

    EditObservation:
      type: object
      required: [comment]
      additionalProperties: false
      properties:
        comment: { type: string, minLength: 1, maxLength: 10000 }

    HypothesisStatus:
      type: string
      enum: [proposed, supported, refuted, superseded]

    Hypothesis:
      type: object
      required: [id, statement, basis, test, status, supersededBy, note]
      properties:
        id: { type: string, example: H2 }
        statement: { type: string }
        basis:
          type: array
          items: { type: string }
        test: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/HypothesisStatus' }
        supersededBy: { type: [string, 'null'] }
        note: { type: [string, 'null'] }

    HypothesisList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Hypothesis' }

    HypothesisInput:
      type: object
      additionalProperties: false
      properties:
        statement: { type: string, minLength: 1, maxLength: 10000 }
        basis:
          type: array
          items: { type: string }
        test: { type: string, description: Выражение; пустая строка убирает тест }
        status: { $ref: '#/components/schemas/HypothesisStatus' }
        supersededBy: { type: string }
        note: { type: string }

    TestRequest:
      type: object
      additionalProperties: false
      properties:
        logId: { type: [string, 'null'], description: Журнал действий; без значения — все }
        windowMs: { type: [integer, 'null'], minimum: 0, maximum: 600000, description: "Окно между действием и сообщением, по умолчанию 2000" }

    TestCounterexample:
      type: object
      required: [anchor, messageId, values, actionLine]
      properties:
        anchor: { $ref: '#/components/schemas/ObservationAnchor' }
        messageId: { type: [string, 'null'] }
        values:
          type: object
          description: Значения имён из выражения на этом сообщении
          additionalProperties: { type: string }
        actionLine: { type: [integer, 'null'] }

    TestIssue:
      type: object
      required: [anchor, detail]
      properties:
        anchor: { $ref: '#/components/schemas/ObservationAnchor' }
        detail: { type: string }

    HypothesisTest:
      type: object
      required: [hypothesis, statement, status, test, verdict, applicable, held, notApplicable, counterexamplesTotal, counterexamples, errorsTotal, errors, logs]
      properties:
        hypothesis: { type: string }
        statement: { type: string }
        status: { $ref: '#/components/schemas/HypothesisStatus' }
        test: { type: string }
        verdict: { type: string, enum: [untested, no_counterexample, refuted] }
        applicable: { type: integer, minimum: 0, description: "Сообщений, к которым тест применим" }
        held: { type: integer, minimum: 0, description: Из них выполнилось }
        notApplicable: { type: integer, minimum: 0 }
        counterexamplesTotal: { type: integer, minimum: 0 }
        counterexamples:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/TestCounterexample' }
        errorsTotal: { type: integer, minimum: 0 }
        errors:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/TestIssue' }
        logs:
          type: array
          items: { type: string }

    Question:
      type: object
      required: [id, text, status, answer]
      properties:
        id: { type: string, example: q-1 }
        text: { type: string }
        status: { type: string, enum: [open, closed] }
        answer: { type: [string, 'null'] }

    QuestionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Question' }

    FramingSpec:
      type: object
      description: Фрейминг в виде, который принимает интерпретация (раздел `framing`)
      required: [kind]
      additionalProperties: false
      properties:
        kind: { type: string, enum: [length_prefixed, delimiter, fixed, magic] }
        length:
          type: object
          required: [at, type]
          additionalProperties: false
          properties:
            at: { type: integer, minimum: 0 }
            type: { type: string, enum: [u8, u16be, u16le, u32be, u32le, u64be, u64le, i8, i16be, i16le, i32be, i32le, i64be, i64le] }
            adjust: { type: integer, description: 'Длина сообщения = значение поля + adjust' }
        size: { type: integer, minimum: 1 }
        bytes: { type: string, description: 'hex' }
        status: { type: string, enum: [rule, hypothesis, unknown] }

    FramingRequest:
      type: object
      required: [streams]
      additionalProperties: false
      properties:
        streams:
          type: array
          minItems: 1
          maxItems: 64
          items: { type: string, description: 'Направленный поток, например 3f5a1c0d:c0001:ab' }

    FramingCounter:
      type: object
      description: Первое место, где кандидат расходится с данными
      required: [stream, offset, run, reason]
      properties:
        stream: { type: string }
        offset: { type: integer, minimum: 0, description: 'Смещение внутри непрерывного участка потока' }
        run: { type: integer, minimum: 0, description: 'Номер непрерывного участка потока (между дырами), с нуля' }
        reason: { type: string, enum: [bad_length, overrun, short_header, dissimilar] }
        value: { type: [integer, 'null'], description: 'Значение поля длины в этом месте' }

    LengthHint:
      type: object
      required: [at, width, bigEndian, adjust, messages, coveredBytes, totalBytes, scorePermille, streamsConfirmed, streamsTotal, streamsEndedExactly, startCoherencePermille, segmentAlignmentPermille, distinctValues, minLength, maxLength, firstCounterexample, equivalent, framing]
      properties:
        at: { type: integer, minimum: 0 }
        width: { type: integer, enum: [1, 2, 4] }
        bigEndian: { type: boolean }
        adjust: { type: integer }
        messages: { type: integer, minimum: 0 }
        coveredBytes: { type: integer, minimum: 0 }
        totalBytes: { type: integer, minimum: 0 }
        scorePermille: { type: integer, minimum: 0, maximum: 1000, description: 'Доля байтов, разбитых на сообщения без противоречий' }
        streamsConfirmed: { type: integer, minimum: 0 }
        streamsTotal: { type: integer, minimum: 0 }
        streamsEndedExactly: { type: integer, minimum: 0 }
        startCoherencePermille: { type: integer, minimum: 0, maximum: 1000, description: 'Доля начал сообщений с самым частым значением на одном из первых 8 смещений' }
        segmentAlignmentPermille: { type: integer, minimum: 0, maximum: 1000, description: 'Доля начал сообщений, совпавших с началами TCP-сегментов' }
        distinctValues: { type: integer, minimum: 0 }
        minLength: { type: integer, minimum: 0 }
        maxLength: { type: integer, minimum: 0 }
        firstCounterexample:
          oneOf:
            - { $ref: '#/components/schemas/FramingCounter' }
            - { type: 'null' }
        equivalent:
          type: array
          description: Другие поля, дающие те же границы (например, младший байт того же числа)
          items:
            type: object
            required: [at, type, adjust]
            properties:
              at: { type: integer }
              type: { type: string }
              adjust: { type: integer }
        framing: { $ref: '#/components/schemas/FramingSpec' }

    FixedHint:
      type: object
      required: [size, messages, scorePermille, framing]
      properties:
        size: { type: integer, minimum: 1 }
        messages: { type: integer, minimum: 0 }
        scorePermille: { type: integer, minimum: 0, maximum: 1000 }
        framing: { $ref: '#/components/schemas/FramingSpec' }

    SignatureHint:
      type: object
      required: [bytes, basis, atStarts, startsTotal, occurrences, framing]
      properties:
        bytes: { type: string, description: 'hex' }
        basis: { type: string, enum: [segments, length_candidate], description: 'По каким началам посчитано' }
        atStarts: { type: integer, minimum: 0 }
        startsTotal: { type: integer, minimum: 0 }
        occurrences: { type: integer, minimum: 0, description: 'Сколько раз последовательность встречается во всех данных' }
        framing: { $ref: '#/components/schemas/FramingSpec' }

    DelimiterHint:
      type: object
      required: [bytes, atEnds, endsTotal, inside, framing]
      properties:
        bytes: { type: string, description: 'hex' }
        atEnds: { type: integer, minimum: 0 }
        endsTotal: { type: integer, minimum: 0 }
        inside: { type: integer, minimum: 0, description: 'Сколько раз встречается не на конце сегмента' }
        framing: { $ref: '#/components/schemas/FramingSpec' }

    FramingHints:
      type: object
      required: [streams, sampledBytes, truncated, incomplete, length, fixed, signatures, delimiters]
      properties:
        streams: { type: array, items: { type: string } }
        sampledBytes: { type: integer, minimum: 0 }
        truncated: { type: boolean, description: 'Часть данных не вошла в анализ (предел размера или числа потоков)' }
        incomplete: { type: boolean, description: 'Поиск прерван по времени: список по длине неполон' }
        length: { type: array, items: { $ref: '#/components/schemas/LengthHint' } }
        fixed: { type: array, items: { $ref: '#/components/schemas/FixedHint' } }
        signatures: { type: array, items: { $ref: '#/components/schemas/SignatureHint' } }
        delimiters: { type: array, items: { $ref: '#/components/schemas/DelimiterHint' } }

    VariabilityRequest:
      type: object
      required: [streams]
      additionalProperties: false
      properties:
        streams: { type: array, minItems: 1, maxItems: 64, items: { type: string } }
        framing: { $ref: '#/components/schemas/FramingSpec' }
        messageId: { type: string, description: 'Только сообщения этого типа (нужна сохранённая интерпретация)' }
        length: { type: integer, minimum: 1, description: 'Длина сообщений для анализа; по умолчанию самая частая' }

    VariabilityColumn:
      type: object
      required: [offset, samples, distinct, entropyMillibits, constant, top]
      properties:
        offset: { type: integer, minimum: 0 }
        samples: { type: integer, minimum: 0 }
        distinct: { type: integer, minimum: 0, maximum: 256 }
        entropyMillibits: { type: integer, minimum: 0, maximum: 8000, description: 'Энтропия в тысячных долях бита' }
        constant: { type: [integer, 'null'], minimum: 0, maximum: 255 }
        top:
          type: array
          items:
            type: object
            required: [value, count]
            properties:
              value: { type: integer, minimum: 0, maximum: 255 }
              count: { type: integer, minimum: 0 }

    Variability:
      type: object
      required: [messages, truncated, classes, length, analysed, columns, regions, counters]
      properties:
        messages: { type: integer, minimum: 0 }
        truncated: { type: boolean }
        classes:
          type: array
          description: Длины сообщений и их количество, частые первыми
          items:
            type: object
            required: [length, count]
            properties:
              length: { type: integer, minimum: 0 }
              count: { type: integer, minimum: 0 }
        length: { type: integer, minimum: 0, description: 'Длина, по которой построены столбцы' }
        analysed: { type: integer, minimum: 0 }
        columns: { type: array, items: { $ref: '#/components/schemas/VariabilityColumn' } }
        regions:
          type: array
          items:
            type: object
            required: [start, end, kind]
            properties:
              start: { type: integer, minimum: 0 }
              end: { type: integer, minimum: 1 }
              kind: { type: string, enum: [constant, varying] }
              bytes: { type: string, description: 'Для постоянной области — её байты, hex' }
        counters:
          type: array
          description: Поля, значение которых растёт на 1 от сообщения к сообщению
          items:
            type: object
            required: [at, width, bigEndian, steps, pairs]
            properties:
              at: { type: integer }
              width: { type: integer, enum: [1, 2, 4] }
              bigEndian: { type: boolean }
              steps: { type: integer }
              pairs: { type: integer }

    CorrelationsRequest:
      type: object
      required: [streams]
      additionalProperties: false
      properties:
        streams: { type: array, minItems: 1, maxItems: 64, items: { type: string } }
        framing: { $ref: '#/components/schemas/FramingSpec' }
        messageId: { type: string, description: 'Только сообщения этого типа (нужна сохранённая интерпретация)' }
        logId: { type: string, description: 'Журнал действий (log-0001); без значения — все' }
        windowMs: { type: integer, minimum: 0, maximum: 600000, description: 'Окно подбора действия, мс (по умолчанию 2000)' }

    CorrelationValue:
      type: object
      required: [param, at, type, scale, matches, samples, sharePermille, firstCounterexample, equivalent]
      properties:
        param: { type: string, description: 'params.<имя> или result.<имя> из журнала' }
        at: { type: integer, minimum: 0 }
        type: { type: string, enum: [u8, i8, u16be, u16le, i16be, i16le, u32be, u32le, i32be, i32le] }
        scale: { type: integer, enum: [1, 10, 100, 1000], description: 'Прочитанное значение = параметр × scale' }
        matches: { type: integer, minimum: 0 }
        samples: { type: integer, minimum: 0 }
        sharePermille: { type: integer, minimum: 0, maximum: 1000 }
        firstCounterexample:
          oneOf:
            - type: object
              required: [stream, start, got, expected]
              properties:
                stream: { type: string }
                start: { type: integer, minimum: 0 }
                got: { type: integer }
                expected: { type: integer }
            - { type: 'null' }
        equivalent: { type: array, items: { type: string }, description: 'Другие чтения тех же байтов с теми же совпадениями, вида тип@смещение' }

    CorrelationAction:
      type: object
      required: [at, type, purityPermille, samples, codes]
      properties:
        at: { type: integer, minimum: 0 }
        type: { type: string, enum: [u8, u16be, u16le] }
        purityPermille: { type: integer, minimum: 0, maximum: 1000 }
        samples: { type: integer, minimum: 0 }
        codes:
          type: array
          items:
            type: object
            required: [action, value, count, of]
            properties:
              action: { type: string }
              value: { type: integer, minimum: 0 }
              count: { type: integer, minimum: 0, description: 'Сообщений действия с этим значением' }
              of: { type: integer, minimum: 0, description: 'Всех сообщений действия' }

    Correlations:
      type: object
      required: [samples, withAction, truncated, values, actions]
      properties:
        samples: { type: integer, minimum: 0 }
        withAction: { type: integer, minimum: 0, description: 'Сообщений, к которым подобрано действие' }
        truncated: { type: boolean }
        values: { type: array, items: { $ref: '#/components/schemas/CorrelationValue' } }
        actions: { type: array, items: { $ref: '#/components/schemas/CorrelationAction' } }

    ExchangesRequest:
      type: object
      required: [connection]
      additionalProperties: false
      properties:
        connection: { type: string, description: 'Идентификатор соединения, например 3f5a1c0d:c0001' }
        framing: { $ref: '#/components/schemas/FramingSpec' }
        limit: { type: integer, minimum: 1, maximum: 500, default: 100 }
        offset: { type: integer, minimum: 0, default: 0 }

    PairedMessage:
      type: object
      required: [stream, start, end, messageId, firstTsNs, lastTsNs]
      properties:
        stream: { type: string }
        start: { type: integer, minimum: 0 }
        end: { type: integer, minimum: 0 }
        messageId: { type: [string, 'null'], description: 'Тип сообщения по интерпретации; null — не определён' }
        firstTsNs: { type: integer, minimum: 0, description: 'Время первого кадра сообщения, нс с эпохи' }
        lastTsNs: { type: integer, minimum: 0 }

    ExchangePair:
      type: object
      required: [requests, responses, delayNs, certainty]
      properties:
        requests: { type: array, items: { $ref: '#/components/schemas/PairedMessage' } }
        responses: { type: array, items: { $ref: '#/components/schemas/PairedMessage' } }
        delayNs: { type: [integer, 'null'], minimum: 0, description: 'От последнего кадра запроса до первого кадра ответа' }
        certainty: { type: string, enum: [certain, ordered, ambiguous, unanswered, unsolicited] }

    ExchangePairPage:
      type: object
      required: [items, total, limit, offset, stats]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ExchangePair' } }
        total: { type: integer, minimum: 0 }
        limit: { type: integer }
        offset: { type: integer }
        stats:
          type: object
          required: [exchanges, certain, ordered, ambiguous, unanswered, unsolicited]
          properties:
            exchanges: { type: integer }
            certain: { type: integer }
            ordered: { type: integer }
            ambiguous: { type: integer }
            unanswered: { type: integer }
            unsolicited: { type: integer }
            minDelayNs: { type: [integer, 'null'] }
            medianDelayNs: { type: [integer, 'null'] }
            maxDelayNs: { type: [integer, 'null'] }

    ReportRequest:
      type: object
      required: [format]
      additionalProperties: false
      properties:
        format: { type: string, enum: [md, html] }
        runId: { type: string, description: 'Прогон (run-0001); без значения — последний' }

    Report:
      type: object
      required: [format, fileName, content]
      properties:
        format: { type: string, enum: [md, html] }
        fileName: { type: string, description: 'Имя файла при сохранении' }
        content: { type: string, description: 'Текст отчёта' }

    NewQuestion:
      type: object
      required: [text]
      additionalProperties: false
      properties:
        text: { type: string, minLength: 1, maxLength: 10000 }

    EditQuestion:
      type: object
      additionalProperties: false
      properties:
        text: { type: string }
        status: { type: string, enum: [open, closed] }
        answer: { type: string }

    ProjectSettingsPatch:
      type: object
      description: Частичное изменение настроек; неизвестные поля — `400`
      additionalProperties: false
      properties:
        overlapPolicy:
          type: string
          enum: [first, last, flag]
        checksumPolicy:
          type: string
          enum: [ignore, warn, drop]

    Project:
      type: object
      required: [name, path, formatVersion, engineVersion, settings, sourceCount]
      properties:
        name: { type: string }
        path: { type: string, description: Путь к папке проекта }
        formatVersion: { type: integer }
        engineVersion: { type: string }
        settings: { $ref: '#/components/schemas/ProjectSettings' }
        sourceCount: { type: integer, minimum: 0 }

    OpenProjectRequest:
      type: object
      required: [path, mode]
      properties:
        path: { type: string, description: Путь к папке проекта }
        mode: { type: string, enum: [open, create] }

    ImportByPathRequest:
      type: object
      required: [path]
      properties:
        path: { type: string, description: Путь к файлу записи на диске }

    SourceStatus:
      type: string
      enum: [importing, ready, error, damaged]
      description: |
        `importing` — идёт импорт, `ready` — готова, `error` — файл не принят или разобран с ошибкой,
        `damaged` — копия в проекте изменена или пропала (sha256 не совпал).

    Source:
      type: object
      required: [sha256, importId, name, format, sizeBytes, status, frameCount, connectionCount]
      properties:
        sha256: { $ref: '#/components/schemas/Sha256' }
        importId: { type: string, description: 'Последний импорт этой записи, `imp-0001`…', example: imp-0001 }
        name: { type: string, description: Исходное имя файла }
        format: { type: string, enum: [pcap, pcapng] }
        sizeBytes: { type: integer, minimum: 0 }
        status: { $ref: '#/components/schemas/SourceStatus' }
        frameCount: { type: integer, minimum: 0 }
        connectionCount: { type: integer, minimum: 0 }

    SourcePage:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Source' }
        total: { type: integer, minimum: 0 }
        limit: { type: integer }
        offset: { type: integer }

    Severity:
      type: string
      enum: [info, warning, error]

    Diagnostic:
      type: object
      description: Группа однотипных замечаний к записи; ограничение реализации или дефект данных, не вывод о протоколе
      required: [code, severity, title, detail, count, frameNumbers]
      properties:
        code:
          type: string
          description: |
            Стабильный код: `unsupported_link_type`, `non_ip`, `ipv6_skipped`, `non_tcp`, `ip_fragment`,
            `truncated_frame`, `bad_ip_header`, `bad_tcp_header`, `bad_checksum`, `bad_block`, `limit_exceeded`
        severity: { $ref: '#/components/schemas/Severity' }
        title: { type: string }
        detail: { type: string }
        count: { type: integer, minimum: 1, description: Сколько кадров затронуто }
        frameNumbers:
          type: array
          maxItems: 100
          description: Первые номера затронутых кадров
          items: { type: integer, minimum: 1 }

    SourceDiagnostics:
      type: object
      required: [sha256, frames, items]
      properties:
        sha256: { $ref: '#/components/schemas/Sha256' }
        frames:
          type: object
          required: [total, parsed, skipped]
          properties:
            total: { type: integer }
            parsed: { type: integer }
            skipped: { type: integer }
        items:
          type: array
          items: { $ref: '#/components/schemas/Diagnostic' }

    Endpoint:
      type: object
      required: [address, port]
      properties:
        address: { type: string, description: Адрес IPv4 }
        port: { type: integer, minimum: 0, maximum: 65535 }

    ConnectionFlag:
      type: string
      enum: [retransmissions, gaps, ambiguous, no_syn, bad_checksum, truncated, reused_ports]
      description: |
        Признаки для значков в списке: повторы сегментов, дыры, неоднозначные перекрытия,
        нет SYN (роли неизвестны), неверные контрольные суммы, усечённые кадры,
        порты переиспользованы раньше (соединение начато заново).

    DirectionKind:
      type: string
      enum: [a_to_b, b_to_a]
      description: '`a` — инициатор, если виден SYN; иначе меньший адрес:порт'

    StreamSummary:
      type: object
      required: [id, direction, length, dataBytes, gapBytes, ambiguousBytes, startAvailable]
      properties:
        id: { type: string, description: '`<соединение>:ab` или `<соединение>:ba`' }
        direction: { $ref: '#/components/schemas/DirectionKind' }
        length: { type: integer, minimum: 0, description: 'Длина потока, байт: data + gap + ambiguous' }
        dataBytes: { type: integer, minimum: 0 }
        gapBytes: { type: integer, minimum: 0 }
        ambiguousBytes: { type: integer, minimum: 0 }
        startAvailable:
          type: boolean
          description: Начало потока известно (виден SYN); иначе смещение 0 — первый наблюдённый байт

    Connection:
      type: object
      required: [id, source, a, b, rolesKnown, firstFrameTime, lastFrameTime, frameCount, close, flags, streams]
      properties:
        id: { type: string, description: 'Идентификатор `<первые 8 hex sha256>:c0001`', example: '3f5a1c0d:c0001' }
        source: { $ref: '#/components/schemas/Sha256' }
        a: { $ref: '#/components/schemas/Endpoint' }
        b: { $ref: '#/components/schemas/Endpoint' }
        rolesKnown: { type: boolean, description: Роли клиент/сервер установлены по SYN }
        firstFrameTime: { type: string, format: date-time, description: Время захвата первого кадра }
        lastFrameTime: { type: string, format: date-time, description: Время захвата последнего кадра }
        frameCount: { type: integer, minimum: 1 }
        close:
          type: string
          enum: [fin, rst, open]
          description: Как закрыто соединение; `open` — конец записи раньше закрытия
        flags:
          type: array
          items: { $ref: '#/components/schemas/ConnectionFlag' }
        flagCounts:
          type: object
          description: |
            Сколько раз встретился каждый признак из `flags` (для значков с числом): повторных кадров,
            участков-дыр, неоднозначных участков, сегментов с неверной суммой или усечённых. У `no_syn`
            и `reused_ports` — 1. Ключи совпадают с `flags`.
          additionalProperties: { type: integer, minimum: 1 }
          propertyNames: { $ref: '#/components/schemas/ConnectionFlag' }
        streams:
          type: array
          description: Два направленных потока
          minItems: 2
          maxItems: 2
          items: { $ref: '#/components/schemas/StreamSummary' }

    ConnectionPage:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Connection' }
        total: { type: integer, minimum: 0 }
        limit: { type: integer }
        offset: { type: integer }

    FrameRef:
      type: object
      required: [source, frameNo, duplicate]
      properties:
        source: { $ref: '#/components/schemas/Sha256' }
        frameNo: { type: integer, minimum: 1 }
        duplicate: { type: boolean, description: Кадр — повтор уже принятых байтов (ретрансмиссия) }

    SegmentStatus:
      type: string
      enum: [data, gap, ambiguous]

    SegmentVariant:
      type: object
      required: [data, frames]
      properties:
        data: { type: string, contentEncoding: base64 }
        frames:
          type: array
          items: { $ref: '#/components/schemas/FrameRef' }

    Segment:
      type: object
      description: Участок карты потока `[start, end)`, обрезанный по запрошенному диапазону
      required: [start, end, status, data, frames]
      properties:
        start: { type: integer, minimum: 0 }
        end: { type: integer, minimum: 1 }
        status: { $ref: '#/components/schemas/SegmentStatus' }
        data:
          type: [string, 'null']
          contentEncoding: base64
          description: Байты участка в base64; `null` для `gap`
        frames:
          type: array
          description: Кадры-источники, включая повторы; для `gap` пусто
          items: { $ref: '#/components/schemas/FrameRef' }
        variants:
          type: array
          description: Только для `ambiguous` — все варианты байтов с кадрами; `data` — выбранный политикой проекта
          items: { $ref: '#/components/schemas/SegmentVariant' }

    StreamBytes:
      type: object
      required: [stream, from, length, streamLength, segments]
      properties:
        stream: { type: string }
        from: { type: integer, minimum: 0 }
        length: { type: integer, minimum: 0, description: Фактическая длина диапазона после усечения по концу потока }
        streamLength: { type: integer, minimum: 0 }
        segments:
          type: array
          description: Участки подряд, без пропусков, покрывают `[from, from+length)`
          items: { $ref: '#/components/schemas/Segment' }

    Ethernet:
      type: object
      required: [src, dst, etherType]
      properties:
        src: { type: string }
        dst: { type: string }
        etherType: { type: integer }

    Ipv4:
      type: object
      required: [src, dst, ttl, protocol, headerLength]
      properties:
        src: { type: string }
        dst: { type: string }
        ttl: { type: integer }
        protocol: { type: integer }
        headerLength: { type: integer }

    Tcp:
      type: object
      required: [srcPort, dstPort, seq, ack, flags, window, headerLength, checksum]
      properties:
        srcPort: { type: integer }
        dstPort: { type: integer }
        seq: { type: integer, minimum: 0, maximum: 4294967295 }
        ack: { type: integer, minimum: 0, maximum: 4294967295 }
        flags:
          type: array
          items: { type: string, enum: [fin, syn, rst, psh, ack, urg, ece, cwr] }
        window: { type: integer }
        headerLength: { type: integer }
        checksum:
          type: string
          enum: [ok, bad, unknown]
          description: '`unknown` — кадр усечён, сумму проверить нельзя'

    StreamRange:
      type: object
      description: Куда попали байты payload кадра
      required: [stream, start, end, duplicate]
      properties:
        stream: { type: string }
        start: { type: integer, minimum: 0 }
        end: { type: integer, minimum: 0 }
        duplicate: { type: boolean }

    Frame:
      type: object
      required: [source, frameNo, time, fileOffset, capturedLength, originalLength, data, diagnostics]
      properties:
        source: { $ref: '#/components/schemas/Sha256' }
        frameNo: { type: integer, minimum: 1 }
        time: { type: string, format: date-time, description: Время захвата из записи }
        fileOffset: { type: integer, minimum: 0, description: Смещение кадра в файле записи }
        capturedLength: { type: integer, minimum: 0 }
        originalLength: { type: integer, minimum: 0, description: Длина на проводе; больше captured — кадр усечён }
        data: { type: string, contentEncoding: base64, description: Байты кадра целиком }
        ethernet: { oneOf: [{ $ref: '#/components/schemas/Ethernet' }, { type: 'null' }] }
        ipv4: { oneOf: [{ $ref: '#/components/schemas/Ipv4' }, { type: 'null' }] }
        tcp: { oneOf: [{ $ref: '#/components/schemas/Tcp' }, { type: 'null' }] }
        payload:
          oneOf:
            - type: object
              required: [offset, length]
              properties:
                offset: { type: integer, minimum: 0, description: Смещение payload внутри кадра }
                length: { type: integer, minimum: 0 }
            - type: 'null'
        streamRange:
          oneOf:
            - { $ref: '#/components/schemas/StreamRange' }
            - type: 'null'
        diagnostics:
          type: array
          description: Замечания к этому кадру
          items:
            type: object
            required: [code, severity, title]
            properties:
              code: { type: string }
              severity: { $ref: '#/components/schemas/Severity' }
              title: { type: string }

    JobKind:
      type: string
      enum: [import, verify]

    JobState:
      type: string
      enum: [queued, running, cancelling, succeeded, failed, cancelled]

    JobProgress:
      type: object
      required: [stage, done, total, unit]
      properties:
        stage:
          type: string
          enum: [reading, reassembling, verifying, saving, done]
        done: { type: integer, minimum: 0 }
        total: { type: integer, minimum: 0, description: "0, если ещё неизвестно" }
        unit: { type: string, enum: [frames, bytes, streams] }

    ImportResult:
      type: object
      required: [sourceSha256, importId]
      properties:
        sourceSha256: { $ref: '#/components/schemas/Sha256' }
        importId: { type: string }

    RunResult:
      type: object
      required: [runId]
      properties:
        runId: { type: string, example: run-0001 }

    Job:
      type: object
      required: [id, kind, state, progress]
      properties:
        id: { type: string, example: job-0001 }
        kind: { $ref: '#/components/schemas/JobKind' }
        state: { $ref: '#/components/schemas/JobState' }
        progress: { $ref: '#/components/schemas/JobProgress' }
        result:
          oneOf:
            - { $ref: '#/components/schemas/ImportResult' }
            - { $ref: '#/components/schemas/RunResult' }
            - type: 'null'
          description: Только для `succeeded`
        error:
          oneOf:
            - { $ref: '#/components/schemas/Problem' }
            - type: 'null'
          description: Только для `failed`

    JobAccepted:
      type: object
      required: [jobId]
      properties:
        jobId: { type: string, example: job-0001 }
