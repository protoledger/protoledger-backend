  /api/action-logs/{id}/clock-offset:
    get:
      tags: [actions]
      operationId: estimateJournalClockOffset
      summary: Сдвиг часов журнала относительно записей
      description: |
        Журнал ведёт одна машина, трафик пишет другая: их часы расходятся на секунды или на часы, и тогда
        в окне времени после действия нет его данных. Движок ищет поправку (до 14 часов в обе стороны),
        при которой кадры с данными идут сразу за наибольшим числом действий. `offsetMs` — сколько
        прибавить ко времени журнала сверх уже заданной поправки `currentOffsetMs`; `null`, если часы
        согласованы (расхождение меньше 100 мс или поправка ничего не добавляет), общего сдвига не видно
        (после поправки данные идут менее чем за 60 % действий) или столько же действий совпадает и при
        другом сдвиге. В `reason` — основание словами. Это предложение: применяет поправку `POST` этого же
        пути с `clockOffsetMs` = `currentOffsetMs` + `offsetMs`. Описание протокола не нужно.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, example: log-0001 }
        - { name: windowMs, in: query, description: 'Окно после действия, в котором ждём данные, мс', schema: { type: integer, minimum: 1, maximum: 600000, default: 2000 } }
      responses:
        '200':
          description: Оценка сдвига с основанием
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClockOffset' }
              example:
                actions: 16
                matchedNow: 2
                offsetMs: 3200
                matchedShifted: 16
                currentOffsetMs: 0
                windowMs: 2000
                reason: 'с поправкой +3200 мс данные в окне 2000 мс идут после 16 из 16 действий, без неё — после 2'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/NoProject' }
    post:
      tags: [actions]
      operationId: applyJournalClockOffset
      summary: Применить поправку часов к импортированному журналу
      description: |
        Сохранённая копия журнала разбирается заново с тем же сопоставлением колонок и новой поправкой
        `clockOffsetMs` (полное значение, а не добавка к прежнему). Результат — новая запись списка: она
        заменяет прежнюю в анализе, прежняя получает `replacedBy` и остаётся в проекте, чтобы прогоны,
        выполненные до поправки, воспроизводились. Прогоны с тестами гипотез помечаются устаревшими
        (`action_logs`); вернуть прежнюю поправку — тем же запросом, и прежние прогоны снова актуальны.
        `409` — проект не открыт, запись уже заменена (поправку применяют к действующей) или поправка
        уже такая.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, example: log-0001 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApplyClockOffsetRequest' }
            example: { clockOffsetMs: 3200 }
      responses:
        '200':
          description: Журнал разобран с поправкой и заменил прежнюю запись
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActionLog' }
              example:
                id: log-0002
                sha256: 3f5a1c0d9e8b7a6f5e4d3c2b1a09f8e7d6c5b4a39281706f5e4d3c2b1a0f9e8d
                name: main.actions.csv
                rows: 16
                skipped: 0
                errors: []
                mapping: { time: time, action: action, params: params, result: result, timeFormat: rfc3339, paramsFormat: kv, resultFormat: kv, utcOffsetMinutes: 0, clockOffsetMs: 3200 }
                firstTime: '2026-10-01T00:00:03.556179000Z'
                lastTime: '2026-10-01T00:00:25.042006000Z'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '415': { $ref: '#/components/responses/UnsupportedMedia' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /api/action-logs/{id}/exchanges:
    get:
      tags: [actions]
      operationId: listActionExchanges
      summary: Обмены для всех действий журнала разом
      description: |
        По строке на каждое действие журнала: запрос стороны, начавшей соединение, найденный в окне времени
        действия, и ответ на него. Сопоставление то же, что в тестах гипотез: действие получает ближайший
        следующий запрос, ответ берётся по ходам обмена. `state`: `paired` — есть запрос и ответ;
        `request_only` — ответ определить нельзя (его нет или пара неоднозначна); `not_found` — запроса в окне
        нет. `candidates` больше 1 — по времени подошли запросы в нескольких соединениях, показан первый.
        Журнал без колонки записи относится к той записи, где сообщение в окне времени нашлось для
        наибольшего числа его действий: запросы других записей не предлагаются и в `candidates` не входят.
        При равенстве записей выбора нет, и подходят запросы каждой.
        Нужна сохранённая интерпретация (`409`).
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, example: log-0001 }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: windowMs, in: query, description: 'Окно подбора запроса, мс', schema: { type: integer, minimum: 0, maximum: 600000, default: 2000 } }
      responses:
        '200':
          description: Таблица действие → запрос и ответ
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActionExchangePage' }
              example:
                items:
                  - line: 2
                    action: set_param
                    tsNs: 1791190809001270000
                    state: paired
                    request: { source: 3f5a1c0d9e2b47a1b6c8d0e1f2a3b4c5d6e7f8091a2b3c4d5e6f708192a3b4c5, stream: '3f5a1c0d:c0001:ab', start: 0, end: 12, messageId: set_param_req, category: matched, tsNs: 1791190809001270000 }
                    response: { source: 3f5a1c0d9e2b47a1b6c8d0e1f2a3b4c5d6e7f8091a2b3c4d5e6f708192a3b4c5, stream: '3f5a1c0d:c0001:ba', start: 0, end: 13, messageId: set_param_resp, category: matched, tsNs: 1791190809003870000 }
                    delayNs: 2600000
                    candidates: 1
                total: 16
                limit: 50
                offset: 0
                paired: 15
                requestOnly: 0
                notFound: 1
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/NoProject' }

  /api/action-logs/{id}/actions/{line}/exchange:
    get:
      tags: [actions]
      operationId: findExchange
      summary: Найти обмен для действия
      description: |
        Кадры и сообщения всех записей проекта во временном окне вокруг действия: от `before` мс до и до `after` мс
        после (по умолчанию 500 и 5000, не больше 600000). Всегда возвращает кадры с данными потоков; если сохранена
        интерпретация — ещё и сообщения (с категориями), чьи кадры попали в окно. Запрос и ответ различаются по
        направлению потока (`ab`, `ba`). Время действия — по журналу с учётом поправки на часы.
      parameters:
        - { $ref: '#/components/parameters/ActionLogId' }
        - { name: line, in: path, required: true, description: "Номер строки действия в файле журнала", schema: { type: integer, minimum: 1 } }
        - { name: before, in: query, description: "Окно до действия, мс", schema: { type: integer, minimum: 0, maximum: 600000, default: 500 } }
        - { name: after, in: query, description: "Окно после действия, мс", schema: { type: integer, minimum: 0, maximum: 600000, default: 5000 } }
      responses:
        '200':
          description: Обмен в окне времени
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Exchange' }
              example:
                action:
                  line: 5
                  time: '2026-10-01T00:00:02.768393000Z'
                  action: set_param
                  params: { param: setpoint, value: 21 }
                  result: { status: ok, applied: 21 }
                  resultRaw: ok;applied=21
                window: { from: '2026-10-01T00:00:02.268393000Z', to: '2026-10-01T00:00:07.768393000Z' }
                interpretationApplied: true
                frames:
                  - { source: 3f5a1c0d9e8b7a6f5e4d3c2b1a09f8e7d6c5b4a39281706f5e4d3c2b1a0f9e8d, stream: 'd05c6bf0:c0001:ab', frameNo: 30, time: '2026-10-01T00:00:02.768513000Z', start: 46, end: 58, duplicate: false }
                messages:
                  - { source: 3f5a1c0d9e8b7a6f5e4d3c2b1a09f8e7d6c5b4a39281706f5e4d3c2b1a0f9e8d, stream: 'd05c6bf0:c0001:ab', start: 46, end: 58, category: matched, messageId: set_param_req, firstTime: '2026-10-01T00:00:02.768513000Z', lastTime: '2026-10-01T00:00:02.768513000Z' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/NoProject' }

  /api/observations:
