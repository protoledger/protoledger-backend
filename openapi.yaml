      tags: [research]
      operationId: updateHypothesis
      summary: Изменить гипотезу
      description: Передайте только изменяемые поля. Статус меняет исследователь; проверка теста сама статус не меняет.
      parameters:
        - { name: id, in: path, required: true, description: "Идентификатор гипотезы", schema: { type: string, example: H2 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HypothesisInput' }
            example: { status: supported, note: 'поддержана на 6 из 6 примеров основной записи' }
      responses:
        '200':
          description: Гипотеза обновлена
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Hypothesis' }
              example: { id: H2, statement: 'value — устанавливаемое значение', basis: [obs-1], test: 'value == action.params.value', status: proposed, supersededBy: null, note: null }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/NoProject' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMedia' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    delete:
      tags: [research]
      operationId: deleteHypothesis
      summary: Удалить гипотезу
      description: Гипотеза, которую заменяет другая (`supersededBy`), не удаляется (`409`).
      parameters:
        - { name: id, in: path, required: true, description: "Идентификатор гипотезы", schema: { type: string, example: H2 } }
      responses:
        '204': { description: Удалено }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/NoProject' }

  /api/hypotheses/{id}/test:
    post:
      tags: [research]
      operationId: testHypothesis
      summary: Проверить тест гипотезы на записях проекта
      description: |
        Применяет тест-выражение гипотезы к сообщениям всех записей проекта по сохранённой интерпретации.
        В выражении доступны поля сообщения (`value`), поля парного ответа (`response.value`), параметры и результат
        действия из журнала (`action.params.value`, `action.result.applied`, `action.result`, `action.name`),
        `message.len`. Сообщение, для которого нужных данных нет, к тесту не применяется (`notApplicable`) — это не успех
        и не неудача. Итог: `no_counterexample` — контрпримеров нет (**не доказательство**), `refuted` — есть
        контрпример (приведён с якорем), `untested` — применимых сообщений нет. Статус гипотезы не меняется.
        Тело обязательно, достаточно `{}`.
      parameters:
        - { name: id, in: path, required: true, description: "Идентификатор гипотезы", schema: { type: string, example: H2 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TestRequest' }
            example: { logId: log-0001 }
      responses:
        '200':
          description: Результат проверки
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HypothesisTest' }
              example:
                hypothesis: H2
                statement: value — устанавливаемое значение
                status: proposed
                test: value == action.params.value
                verdict: no_counterexample
                applicable: 6
                held: 6
                notApplicable: 26
                counterexamplesTotal: 0
                counterexamples: []
                errorsTotal: 0
                errors: []
                logs: [log-0001]
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/NoProject' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMedia' }
        '422': { $ref: '#/components/responses/Unprocessable' }

