            example: { statement: 'value — устанавливаемое значение', basis: [obs-1], test: 'value == action.params.value' }
      responses:
        '201':
          description: Гипотеза создана
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Hypothesis' }
              example: { id: H2, statement: 'value — устанавливаемое значение', basis: [obs-1], test: 'value == action.params.value', status: proposed, supersededBy: null, note: null }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/NoProject' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMedia' }
        '422': { $ref: '#/components/responses/Unprocessable' }

