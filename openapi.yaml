openapi: 3.1.0
info:
  title: protoledger API
  version: 0.1.45
  description: |
    Локальный HTTP API движка protoledger (контракт v0, фаза Ф1).
    Слушает только 127.0.0.1. Каждый запрос к `/api` проверяется: `Host` → 403,
    `Origin` (если есть) → 403, заголовок `X-Protoledger-Token` → 401.
    Токен сессии движок отдаёт только своей SPA в `<meta name="protoledger-token">`.
    Ошибки — RFC 9457 Problem Details, `title` и `detail` по-русски.
    Все смещения и длины — целые числа (в пределах 2^53), время — строка RFC 3339 в UTC с наносекундами.
servers:
  - url: http://localhost:8080
security:
  - sessionToken: []
tags:
  - name: system
    description: Состояние движка
  - name: project
    description: Проект — папка исследования
  - name: sources
    description: Записи трафика (PCAP/PCAPNG) и их импорт
  - name: explore
    description: Соединения, потоки, кадры
  - name: interpretation
    description: Описание протокола (интерпретация) и его применение к потокам
  - name: runs
    description: Прогоны проверки интерпретации на корпусе
  - name: actions
    description: Журналы действий клиента и поиск обмена по действию
  - name: research
    description: Наблюдения, гипотезы и вопросы исследователя
  - name: analysis
    description: Подсказки исследователю — границы сообщений, изменчивость байтов, пары запрос-ответ
  - name: reports
    description: Отчёт по проекту
  - name: jobs
    description: Долгие операции с прогрессом и отменой

paths:
  /api/health:
    get:
      tags: [system]
      operationId: getHealth
      summary: Проверка, что движок запущен
      responses:
        '200':
          description: Движок работает
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
              example: { status: ok, version: 0.1.0 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/project:
    get:
      tags: [project]
      operationId: getProject
      summary: Текущий открытый проект
      responses:
        '200':
          description: Проект открыт
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
              example:
                name: demo
                path: /workspace/demo.protoledger
                formatVersion: 1
                engineVersion: 0.1.0
                settings: { overlapPolicy: first, checksumPolicy: warn }
                sourceCount: 2
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/NoProject' }
    post:
      tags: [project]
      operationId: openProject
      summary: Создать или открыть проект
      description: |
        `mode: open` — открыть существующую папку проекта, `mode: create` — создать новую
        (папка не должна существовать или должна быть пустой, родительская — существовать).
        Относительный `path` отсчитывается от каталога проектов движка (`--workspace`), абсолютный — как есть;
        `..` в пути — `400`. Предыдущий проект закрывается; пока идут задачи — `409`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OpenProjectRequest' }
            example: { path: /workspace/demo.protoledger, mode: create }
      responses:
        '200':
          description: Проект открыт или создан
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
              example:
                name: demo
                path: /workspace/demo.protoledger
                formatVersion: 1
                engineVersion: 0.1.0
                settings: { overlapPolicy: first, checksumPolicy: warn }
                sourceCount: 0
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMedia' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /api/project/next-steps:
    get:
      tags: [project]
      operationId: getNextSteps
      summary: Что дальше — следующие шаги исследования
      description: |
        По состоянию проекта подсказывает, что делать дальше, и объясняет почему: нет записей — импортировать;
        нет описания — искать границы или собрать черновик; нет прогона или он устарел — запустить проверку;
        есть опровергнутые гипотезы или контрпримеры — разобрать их; у гипотез нет тестов — добавить; остались
        неизвестные зоны и открытые вопросы — вернуться к ним; всё сошлось — сформировать отчёт. `steps` идут
        по убыванию пользы, у каждого `screen` — экран, где шаг делается. `state` — числа, по которым шаги
        выбраны. Подсказка ничего не делает сама.
      responses:
        '200':
          description: Шаги и состояние проекта
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NextSteps' }
              example:
                steps:
                  - id: fix_refuted
                    screen: hypotheses
                    title: Разберите опровергнутые гипотезы
                    detail: 'В последнем прогоне опровергнуты: H6. Посмотрите контрпримеры и подсказку исправления.'
                state:
                  sources: 12
                  actionLogs: 1
                  hasInterpretation: true
                  messageTypes: 7
                  hypotheses: 12
                  hypothesesWithoutTest: 1
                  unknownFields: 1
                  runs: 1
                  lastRun: run-0001
                  lastRunStale: false
                  counterexamples: 0
                  refuted: [H6]
                  untested: []
                  openQuestions: 2
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/NoProject' }

  /api/project/settings:
    patch:
      tags: [project]
      operationId: updateProjectSettings
      summary: Изменить настройки сборки потоков
      description: |
        Меняет политики сборки TCP: `overlapPolicy` (что делать с перекрытием с различающимися байтами:
        `first` — брать более ранний сегмент, `last` — более поздний, `flag` — не выбирать, участок
        остаётся неоднозначным без принятых байтов) и `checksumPolicy` (`ignore`, `warn`, `drop`).
        Передайте только изменяемые поля. Если настройки изменились, записи проекта заново собираются
        фоновой задачей; они появляются в `GET /api/sources` по мере готовности. Пока идут задачи — `409`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectSettingsPatch' }
            example: { overlapPolicy: flag }
      responses:
        '200':
          description: Проект с новыми настройками
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
              example:
                name: demo
                path: /workspace/demo.protoledger
                formatVersion: 1
                engineVersion: 0.1.0
                settings: { overlapPolicy: flag, checksumPolicy: warn }
                sourceCount: 2
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/NoProject' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMedia' }

  /api/interpretation:
    get:
      tags: [interpretation]
      operationId: getInterpretation
      summary: Текущая интерпретация проекта
      description: Последняя сохранённая ревизия. Пока интерпретацию не сохраняли — `404`.
      responses:
        '200':
          description: Последняя ревизия с текстом
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InterpretationDoc' }
              example:
                rev: 2
                digest: 7d2c1e9b0a4f3d6c8b5a1e0f9d8c7b6a5f4e3d2c1b0a9f8e7d6c5b4a39281706
                yaml: "format: protoledger/interpretation@1\nframing: { kind: length_prefixed, length: { at: 4, type: u16le, adjust: 7 } }\n"
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/NoProject' }
    put:
      tags: [interpretation]
      operationId: saveInterpretation
      summary: Сохранить интерпретацию новой ревизией
      description: |
        Текст проверяется по схеме `protoledger/interpretation@1`: ошибка — `422` с описанием места и причины,
        ревизия не создаётся. Если каноническая форма (digest) не отличается от последней ревизии, новая ревизия
        не создаётся (`created: false`). Старые ревизии не изменяются. `baseRev` — ревизия, от которой сделана
        правка (`0` — интерпретации ещё не было): если после неё сохранена другая ревизия с другим смыслом, —
        `409`, ничего не сохраняется (правка из второй вкладки или от устаревшего текста не затирает чужую).
        Без `baseRev` — сохранение как раньше.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SaveInterpretationRequest' }
            example: { yaml: "format: protoledger/interpretation@1\nframing: { kind: fixed, size: 8 }\n" }
      responses:
        '200':
          description: Ревизия сохранена или найдена такая же
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SaveInterpretationResult' }
              example: { rev: 3, digest: 7d2c1e9b0a4f3d6c8b5a1e0f9d8c7b6a5f4e3d2c1b0a9f8e7d6c5b4a39281706, created: true }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Проект не открыт или правка сделана от устаревшей ревизии (`baseRev`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                type: urn:protoledger:problem:conflict
                title: Конфликт состояния
                status: 409
                detail: 'Описание изменилось: правка сделана от ревизии 3, а после неё сохранена ревизия 4. Откройте ревизию 4 и перенесите правку.'
        '413': { $ref: '#/components/responses/TooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMedia' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /api/interpretation/revisions:
    get:
      tags: [interpretation]
      operationId: listInterpretationRevisions
      summary: Ревизии интерпретации
      responses:
        '200':
          description: Ревизии по порядку, с первой
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InterpretationRevisionList' }
              example:
                items:
                  - { rev: 1, digest: 5b1a0c9d8e7f6a5b4c3d2e1f0a9b8c7d6e5f4a3b2c1d0e9f8a7b6c5d4e3f2a10 }
                  - { rev: 2, digest: 7d2c1e9b0a4f3d6c8b5a1e0f9d8c7b6a5f4e3d2c1b0a9f8e7d6c5b4a39281706 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/NoProject' }

  /api/interpretation/revisions/{rev}:
    get:
      tags: [interpretation]
      operationId: getInterpretationRevision
      summary: Ревизия интерпретации по номеру
      parameters:
        - name: rev
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Ревизия с текстом
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InterpretationDoc' }
              example:
                rev: 2
                digest: 7d2c1e9b0a4f3d6c8b5a1e0f9d8c7b6a5f4e3d2c1b0a9f8e7d6c5b4a39281706
                yaml: "format: protoledger/interpretation@1\nframing: { kind: length_prefixed, length: { at: 4, type: u16le, adjust: 7 } }\n"
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/NoProject' }

  /api/interpretation/preview:
    post:
      tags: [interpretation]
      operationId: previewInterpretation
      summary: Применить интерпретацию к потоку (предпросмотр)
      description: |
        Применяет интерпретацию к направленному потоку и возвращает сообщения с полями, статусами знания,
        нарушениями и категориями результата. Ничего не сохраняет. Без `yaml` берётся последняя сохранённая
        ревизия; с `yaml` — переданный текст (для редактора). Сообщения постранично, фильтр по `category`.
        Целые числа за пределами \`±2^53\` отдаются десятичной строкой (`valueType: int`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PreviewRequest' }
            example: { stream: 'd05c6bf0:c0001:ab', limit: 50 }
      responses:
        '200':
          description: Результат применения
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PreviewPage' }
              example:
                rev: 2
                digest: 7d2c1e9b0a4f3d6c8b5a1e0f9d8c7b6a5f4e3d2c1b0a9f8e7d6c5b4a39281706
                outOfScope: false
                counts: { matched: 1 }
                unknownBytes: 0
                items:
                  - start: 0
                    end: 12
                    category: matched
                    messageId: set_param_req
                    unknownBytes: 0
                    fields:
                      - { name: type, at: 2, len: 1, status: rule, hypothesis: null, state: decoded, valueType: int, value: 2 }
                      - { name: value, at: 7, len: 4, status: hypothesis, hypothesis: H2, state: decoded, valueType: int, value: 21 }
                    violations: []
                total: 1
                limit: 50
                offset: 0
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/NoProject' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMedia' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /api/interpretation/compare:
    post:
      tags: [interpretation]
      operationId: compareCaptures
      summary: Сравнение поведения в двух наборах записей
      description: |
        Применяет одно описание к наборам записей `a` и `b` и показывает отличия: типы сообщений, которые есть
        только в одном наборе; поля, у которых изменились значения (у перечислений до 16 значений — какие
        появились и пропали, у остальных числовых — стал ли шире диапазон); время от запроса до ответа по типам
        запросов (медиана и максимум, `ratioPermille` — отношение медиан). `summary` — главное словами, по строке
        на отличие. Сценарии: до и после обновления прошивки, штатная работа и сбой, два экземпляра устройства.
        `yaml` — несохранённый текст описания; без него берётся текущая ревизия.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompareRequest' }
            example:
              a: ['3f5a1c0d9e2b47a1b6c8d0e1f2a3b4c5d6e7f8091a2b3c4d5e6f708192a3b4c5']
              b: ['7c11e02a9e2b47a1b6c8d0e1f2a3b4c5d6e7f8091a2b3c4d5e6f708192a3b4c5']
      responses:
        '200':
          description: Отличия
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Comparison' }
              example:
                a: { sources: 1, messages: 32, counts: { matched: 32 } }
                b: { sources: 1, messages: 22, counts: { matched: 22 } }
                types:
                  - { messageId: set_param_req, a: 6, b: 5, change: same }
                fields:
                  - messageId: set_param_req
                    field: value
                    change: values
                    a: { samples: 6, distinct: 3, min: 21, max: 1000 }
                    b: { samples: 5, distinct: 3, min: -5, max: 123456 }
                    newValues: ['-5', '123456', '70000']
                    goneValues: ['1000', '21', '37']
                timing:
                  - { messageId: set_param_req, a: { pairs: 6, medianNs: 2000000, maxNs: 2400000 }, b: { pairs: 5, medianNs: 2100000, maxNs: 2500000 }, ratioPermille: 1050 }
                summary: ['set_param_req.value: во втором наборе новые значения — -5, 123456, 70000']
                incomplete: false
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/NoProject' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMedia' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /api/interpretation/graph:
    post:
      tags: [interpretation]
      operationId: getExchangeGraph
      summary: Граф обмена — типы сообщений, ответы и переходы
      description: |
        По всем соединениям записей: `nodes` — типы сообщений и сколько раз их отправила каждая сторона;
        `answers` — чем отвечают на запрос (только пары, где ответ определён однозначно или по порядку);
        `next` — какой запрос той же стороны идёт следом в соединении; `starts` — с чего соединения
        начинаются; счётчики запросов без ответа и сообщений без запроса. `dot` — тот же граф в формате
        Graphviz DOT: сплошные стрелки — ответы, пунктирные — следующий запрос. Это наблюдаемое поведение
        на записях, а не заявленный автомат состояний. `yaml` — несохранённый текст описания; `sources` —
        только эти записи.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CoverageRequest' }
            example: {}
      responses:
        '200':
          description: Граф обмена
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExchangeGraph' }
              example:
                connections: 1
                messages: 32
                nodes:
                  - { id: set_param_req, requests: 6, responses: 0 }
                  - { id: set_param_resp, requests: 0, responses: 6 }
                answers: [{ from: set_param_req, to: set_param_resp, count: 6 }]
                next: [{ from: set_param_req, to: set_param_req, count: 5 }]
                starts: [{ from: начало, to: set_param_req, count: 1 }]
                unanswered: 0
                unsolicited: 0
                dot: "digraph exchange {\n  rankdir=LR;\n}\n"
                truncated: false
                incomplete: false
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/NoProject' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMedia' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /api/interpretation/coverage:
    post:
      tags: [interpretation]
      operationId: getCoverage
      summary: Карта покрытия — что в сообщениях описано, а что ещё нет
      description: |
        Применяет описание к записям проекта и для каждого типа сообщений считает байты: описанные полем со
        статусом «правило» (`rule`), полем-гипотезой (`hypothesis`), объявленные неизвестными (`unknown`) и не
        описанные вовсе (`none`). `regions` — карта первых 256 байт сообщения: подряд идущие смещения с одним
        описанием, имя поля, гипотеза и доля сообщений, где эти байты описаны именно так (сообщения одного типа
        бывают разной длины). При наложении полей (битовые поля одного байта) байт считается один раз, по самому
        твёрдому описанию. `messageId: null` — сообщения, тип которых не определён. `describedPermille` — доля
        байтов под правилом или гипотезой: честная граница знания о протоколе. `yaml` — несохранённый текст
        описания; `sources` — только эти записи.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CoverageRequest' }
            example: {}
      responses:
        '200':
          description: Карта покрытия
          content:
            application/json:
