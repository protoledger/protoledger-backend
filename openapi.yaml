      operationId: guessActionLogMapping
      summary: Угадать колонки журнала действий
      description: |
        Предложение сопоставления колонок по заголовкам и содержимому: разделитель, колонка времени и её формат
        (из нескольких — начало действия), действие, параметры и результат (JSON или `ключ=значение`), колонка записи.
        Для каждой роли — причина в `reasons`; догадка сразу проверяется пробным разбором (`rows`, `skipped`).
        Это предложение: пользователь принимает его или правит перед импортом. Проект не нужен; относительный
        `path` — от каталога проектов.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              additionalProperties: false
              properties:
                path: { type: string, description: Путь к файлу журнала на диске }
            example: { path: thermostand/sample_protocol/action_journal.csv }
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary, description: CSV журнала }
      responses:
        '200':
          description: Догадка с причинами и пробным разбором
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActionLogGuess' }
              example:
