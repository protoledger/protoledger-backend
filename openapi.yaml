openapi: 3.1.0
info:
  title: protoledger API
  version: 0.1.10
  description: |
    Локальный HTTP API движка protoledger (контракт v0, фаза Ф1).
    Слушает только 127.0.0.1. Каждый запрос к `/api` проверяется: `Host` → 403,
    `Origin` (если есть) → 403, заголовок `X-Protoledger-Token` → 401.
    Токен сессии движок отдаёт только своей SPA в `<meta name="protoledger-token">`.
    Ошибки — RFC 9457 Problem Details, `title` и `detail` по-русски.
    Все смещения и длины — целые числа (в пределах 2^53), время — строка RFC 3339 в UTC с наносекундами.
servers:
  - url: http://localhost:8080
security:
  - sessionToken: []
tags:
  - name: system
    description: Состояние движка
  - name: project
    description: Проект — папка исследования
  - name: sources
    description: Записи трафика (PCAP/PCAPNG) и их импорт
  - name: explore
    description: Соединения, потоки, кадры
  - name: interpretation
    description: Описание протокола (интерпретация) и его применение к потокам
  - name: runs
    description: Прогоны проверки интерпретации на корпусе
  - name: actions
    description: Журналы действий клиента и поиск обмена по действию
  - name: research
    description: Наблюдения, гипотезы и вопросы исследователя
  - name: analysis
    description: Подсказки исследователю — границы сообщений, изменчивость байтов, пары запрос-ответ
  - name: reports
    description: Отчёт по проекту
  - name: jobs
    description: Долгие операции с прогрессом и отменой

paths:
  /api/health:
    get:
      tags: [system]
      operationId: getHealth
      summary: Проверка, что движок запущен
      responses:
        '200':
          description: Движок работает
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
              example: { status: ok, version: 0.1.0 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/project:
    get:
      tags: [project]
      operationId: getProject
      summary: Текущий открытый проект
      responses:
        '200':
          description: Проект открыт
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
              example:
                name: demo
                path: /workspace/demo.protoledger
                formatVersion: 1
                engineVersion: 0.1.0
                settings: { overlapPolicy: first, checksumPolicy: warn }
                sourceCount: 2
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/NoProject' }
    post:
      tags: [project]
      operationId: openProject
      summary: Создать или открыть проект
      description: |
        `mode: open` — открыть существующую папку проекта, `mode: create` — создать новую
        (папка не должна существовать или должна быть пустой, родительская — существовать).
        Относительный `path` отсчитывается от каталога проектов движка (`--workspace`), абсолютный — как есть;
        `..` в пути — `400`. Предыдущий проект закрывается; пока идут задачи — `409`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OpenProjectRequest' }
            example: { path: /workspace/demo.protoledger, mode: create }
      responses:
        '200':
          description: Проект открыт или создан
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
              example:
                name: demo
                path: /workspace/demo.protoledger
                formatVersion: 1
                engineVersion: 0.1.0
                settings: { overlapPolicy: first, checksumPolicy: warn }
                sourceCount: 0
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /api/project/settings:
    patch:
      tags: [project]
      operationId: updateProjectSettings
      summary: Изменить настройки сборки потоков
      description: |
        Меняет политики сборки TCP: `overlapPolicy` (что делать с перекрытием с различающимися байтами:
        `first` — брать более ранний сегмент, `last` — более поздний, `flag` — не выбирать, участок
        остаётся неоднозначным без принятых байтов) и `checksumPolicy` (`ignore`, `warn`, `drop`).
        Передайте только изменяемые поля. Если настройки изменились, записи проекта заново собираются
        фоновой задачей; они появляются в `GET /api/sources` по мере готовности. Пока идут задачи — `409`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectSettingsPatch' }
            example: { overlapPolicy: flag }
      responses:
        '200':
          description: Проект с новыми настройками
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
              example:
                name: demo
                path: /workspace/demo.protoledger
                formatVersion: 1
                engineVersion: 0.1.0
                settings: { overlapPolicy: flag, checksumPolicy: warn }
                sourceCount: 2
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/NoProject' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMedia' }

  /api/interpretation:
    get:
      tags: [interpretation]
      operationId: getInterpretation
      summary: Текущая интерпретация проекта
      description: Последняя сохранённая ревизия. Пока интерпретацию не сохраняли — `404`.
      responses:
        '200':
          description: Последняя ревизия с текстом
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InterpretationDoc' }
              example:
                rev: 2
                digest: 7d2c1e9b0a4f3d6c8b5a1e0f9d8c7b6a5f4e3d2c1b0a9f8e7d6c5b4a39281706
                yaml: "format: protoledger/interpretation@1\nframing: { kind: length_prefixed, length: { at: 4, type: u16le, adjust: 7 } }\n"
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/NoProject' }
    put:
      tags: [interpretation]
      operationId: saveInterpretation
      summary: Сохранить интерпретацию новой ревизией
      description: |
        Текст проверяется по схеме `protoledger/interpretation@1`: ошибка — `422` с описанием места и причины,
        ревизия не создаётся. Если каноническая форма (digest) не отличается от последней ревизии, новая ревизия
        не создаётся (`created: false`). Старые ревизии не изменяются.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SaveInterpretationRequest' }
            example: { yaml: "format: protoledger/interpretation@1\nframing: { kind: fixed, size: 8 }\n" }
      responses:
        '200':
          description: Ревизия сохранена или найдена такая же
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SaveInterpretationResult' }
              example: { rev: 3, digest: 7d2c1e9b0a4f3d6c8b5a1e0f9d8c7b6a5f4e3d2c1b0a9f8e7d6c5b4a39281706, created: true }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/NoProject' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMedia' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /api/interpretation/revisions:
    get:
      tags: [interpretation]
      operationId: listInterpretationRevisions
      summary: Ревизии интерпретации
      responses:
        '200':
          description: Ревизии по порядку, с первой
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InterpretationRevisionList' }
              example:
                items:
                  - { rev: 1, digest: 5b1a0c9d8e7f6a5b4c3d2e1f0a9b8c7d6e5f4a3b2c1d0e9f8a7b6c5d4e3f2a10 }
                  - { rev: 2, digest: 7d2c1e9b0a4f3d6c8b5a1e0f9d8c7b6a5f4e3d2c1b0a9f8e7d6c5b4a39281706 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/NoProject' }

  /api/interpretation/revisions/{rev}:
    get:
      tags: [interpretation]
      operationId: getInterpretationRevision
      summary: Ревизия интерпретации по номеру
      parameters:
        - name: rev
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Ревизия с текстом
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InterpretationDoc' }
              example:
                rev: 2
                digest: 7d2c1e9b0a4f3d6c8b5a1e0f9d8c7b6a5f4e3d2c1b0a9f8e7d6c5b4a39281706
                yaml: "format: protoledger/interpretation@1\nframing: { kind: length_prefixed, length: { at: 4, type: u16le, adjust: 7 } }\n"
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/NoProject' }

  /api/interpretation/preview:
    post:
      tags: [interpretation]
      operationId: previewInterpretation
      summary: Применить интерпретацию к потоку (предпросмотр)
      description: |
        Применяет интерпретацию к направленному потоку и возвращает сообщения с полями, статусами знания,
        нарушениями и категориями результата. Ничего не сохраняет. Без `yaml` берётся последняя сохранённая
        ревизия; с `yaml` — переданный текст (для редактора). Сообщения постранично, фильтр по `category`.
        Целые числа за пределами \`±2^53\` отдаются десятичной строкой (`valueType: int`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PreviewRequest' }
            example: { stream: 'd05c6bf0:c0001:ab', limit: 50 }
      responses:
        '200':
          description: Результат применения
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PreviewPage' }
              example:
                rev: 2
                digest: 7d2c1e9b0a4f3d6c8b5a1e0f9d8c7b6a5f4e3d2c1b0a9f8e7d6c5b4a39281706
                outOfScope: false
                counts: { matched: 1 }
                unknownBytes: 0
                items:
                  - start: 0
                    end: 12
                    category: matched
                    messageId: set_param_req
                    unknownBytes: 0
                    fields:
                      - { name: type, at: 2, len: 1, status: rule, hypothesis: null, state: decoded, valueType: int, value: 2 }
                      - { name: value, at: 7, len: 4, status: hypothesis, hypothesis: H2, state: decoded, valueType: int, value: 21 }
                    violations: []
                total: 1
                limit: 50
                offset: 0
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/NoProject' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMedia' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /api/runs:
    get:
      tags: [runs]
      operationId: listRuns
      summary: Прогоны проверки, новые первыми
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Offset' }
      responses:
        '200':
          description: Страница прогонов со сводкой и признаком устаревания
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunPage' }
              example:
                items:
                  - id: run-0002
                    revision: 2
                    interpretationDigest: 7d2c1e9b0a4f3d6c8b5a1e0f9d8c7b6a5f4e3d2c1b0a9f8e7d6c5b4a39281706
                    settingsDigest: 7d2c1e9b0a4f3d6c8b5a1e0f9d8c7b6a5f4e3d2c1b0a9f8e7d6c5b4a39281706
                    corpus: {}
                    sources: [3f5a1c0d9e8b7a6f5e4d3c2b1a09f8e7d6c5b4a39281706f5e4d3c2b1a0f9e8d]
                    engineVersion: 0.1.0
                    summary:
                      streams: 2
                      outOfScopeStreams: 0
                      messages: 32
                      messageBytes: 61586
                      unknownBytes: 0
                      counts: { matched: 31, violated: 1 }
                      byMessage: { set_param_req: { matched: 6 }, measure_resp: { matched: 5, violated: 1 } }
                      counterexamples: 1
                      counterexamplesTruncated: false
                    stale: false
                    staleReasons: []
                total: 1
                limit: 50
                offset: 0
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/NoProject' }
    post:
      tags: [runs]
      operationId: startRun
      summary: Запустить прогон (задача)
      description: |
        Применяет интерпретацию к потокам корпуса. Без `revision` берётся последняя ревизия, без `corpus` — все
        потоки всех записей проекта. Фильтры корпуса сохраняются в прогоне и видны рядом со сводкой. Прогон —
        задача (`202`, SSE прогресса, отмена); результат задачи — `{runId}`. Без открытого проекта, без
        интерпретации и без записей — `409`.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StartRunRequest' }
            example: { revision: 2, corpus: { port: 4710 } }
      responses:
        '202':
          description: Прогон принят, создана задача
          headers:
            Location:
              description: Адрес задачи
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobAccepted' }
              example: { jobId: job-0003 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/NoProject' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMedia' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyJobs' }

  /api/runs/diff:
    get:
      tags: [runs]
      operationId: diffRuns
      summary: Сравнить два прогона
      description: |
        Сообщения сопоставляются по потоку и началу. `fixed` — стало лучше (нарушенное или не охваченное теперь
        совпало), `regressed` — хуже, `changed` — категория другого рода, `added` и `removed` — сообщения
        есть только во втором или только в первом прогоне. Устаревший прогон помечен (`staleA`, `staleB`).
      parameters:
        - { name: a, in: query, required: true, description: Первый прогон, schema: { type: string, example: run-0001 } }
        - { name: b, in: query, required: true, description: Второй прогон, schema: { type: string, example: run-0002 } }
        - { name: kind, in: query, description: Только изменения этого вида, schema: { $ref: '#/components/schemas/ChangeKind' } }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Offset' }
      responses:
        '200':
          description: Итог сравнения и страница изменений
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunDiffPage' }
              example:
                a: run-0001
                b: run-0002
                staleA: true
                staleB: false
                totals: { fixed: 1, regressed: 0, changed: 0, added: 0, removed: 0, unchanged: 31 }
                countsA: { matched: 31, violated: 1 }
                countsB: { matched: 32 }
                items:
                  - { stream: 'd05c6bf0:c0001:ba', start: 1210, end: 61210, kind: fixed, from: violated, to: matched, messageId: measure_resp }
                total: 1
                limit: 100
                offset: 0
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/NoProject' }

  /api/runs/{id}:
    get:
      tags: [runs]
      operationId: getRun
      summary: "Прогон: сводка, потоки и контрпримеры"
      parameters:
        - { $ref: '#/components/parameters/RunId' }
      responses:
        '200':
          description: Прогон
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunDetail' }
              example:
                id: run-0002
                revision: 2
                interpretationDigest: 7d2c1e9b0a4f3d6c8b5a1e0f9d8c7b6a5f4e3d2c1b0a9f8e7d6c5b4a39281706
                settingsDigest: 7d2c1e9b0a4f3d6c8b5a1e0f9d8c7b6a5f4e3d2c1b0a9f8e7d6c5b4a39281706
                corpus: {}
                sources: [3f5a1c0d9e8b7a6f5e4d3c2b1a09f8e7d6c5b4a39281706f5e4d3c2b1a0f9e8d]
                engineVersion: 0.1.0
                summary:
                  streams: 2
                  outOfScopeStreams: 0
                  messages: 32
                  messageBytes: 61586
                  unknownBytes: 0
                  counts: { matched: 31, violated: 1 }
                  byMessage: { set_param_req: { matched: 6 }, measure_resp: { matched: 5, violated: 1 } }
                  counterexamples: 1
                  counterexamplesTruncated: false
                stale: false
                staleReasons: []
                streams:
                  - { id: 'd05c6bf0:c0001:ab', source: 3f5a1c0d9e8b7a6f5e4d3c2b1a09f8e7d6c5b4a39281706f5e4d3c2b1a0f9e8d, outOfScope: false, counts: { matched: 16 }, unknownBytes: 0, messageBytes: 152, messages: 16 }
                counterexamples:
                  - anchor: { source: 3f5a1c0d9e8b7a6f5e4d3c2b1a09f8e7d6c5b4a39281706f5e4d3c2b1a0f9e8d, stream: 'd05c6bf0:c0001:ba', start: 1210, end: 61210, sha256: 7d2c1e9b0a4f3d6c8b5a1e0f9d8c7b6a5f4e3d2c1b0a9f8e7d6c5b4a39281706 }
                    category: violated
                    messageId: measure_resp
                    violations:
                      - { kind: check, id: C2, detail: контрольная сумма не сходится, status: rule }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/NoProject' }

  /api/runs/{id}/items:
    get:
      tags: [runs]
      operationId: listRunItems
      summary: Сообщения прогона с категориями
      description: Таблица всех сообщений корпуса с фильтрами; `messageId=?` — сообщения без определённого типа.
      parameters:
        - { $ref: '#/components/parameters/RunId' }
        - { name: stream, in: query, description: Только этот поток, schema: { type: string } }
        - { name: category, in: query, schema: { $ref: '#/components/schemas/ResultCategory' } }
        - { name: messageId, in: query, schema: { type: string } }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Offset' }
      responses:
        '200':
          description: Страница сообщений
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunItemPage' }
              example:
                items:
                  - { stream: 'd05c6bf0:c0001:ab', start: 0, end: 8, category: matched, messageId: read_param_req }
                total: 32
                limit: 50
                offset: 0
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/NoProject' }

  /api/action-logs:
    get:
      tags: [actions]
      operationId: listActionLogs
      summary: Журналы действий проекта
      responses:
        '200':
          description: Журналы в порядке импорта
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActionLogList' }
              example:
                items:
