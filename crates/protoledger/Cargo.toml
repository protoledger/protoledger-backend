[package]
name = "protoledger"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
pl-actions = { version = "0.1.0", path = "../pl-actions" }
pl-report = { version = "0.1.0", path = "../pl-report" }
pl-app = { version = "0.1.0", path = "../pl-app" }
pl-capture = { path = "../pl-capture" }
pl-core = { version = "0.1.0", path = "../pl-core" }
pl-interp = { version = "0.1.0", path = "../pl-interp" }
pl-project = { version = "0.1.0", path = "../pl-project" }
pl-reassembly = { version = "0.1.0", path = "../pl-reassembly" }
pl-server = { path = "../pl-server" }
pl-verify = { version = "0.1.0", path = "../pl-verify" }
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = "1.3.0"
serde_json = "1.0.151"
sha2 = "0.11.0"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros"] }
tracing-subscriber = "0.3.23"

[features]
dev-tools = ["pl-server/dev-tools"]
