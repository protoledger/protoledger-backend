[package]
name = "pl-stand"
description = "Стенд-устройство: бинарный протокол по TCP, сценарии клиента, журнал действий и запись трафика (тестовые данные)"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
pl-synth = { path = "../pl-synth" }

[dev-dependencies]
etherparse = "0.21.0"
pcap-parser = "0.17.0"
pl-capture = { path = "../pl-capture" }
pl-reassembly = { path = "../pl-reassembly" }
