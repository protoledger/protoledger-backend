[package]
name = "pl-server"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
axum = { version = "0.8.9", features = ["multipart"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
getrandom = "0.4.3"
mime_guess = "2.0.5"
pl-app = { version = "0.1.0", path = "../pl-app" }
pl-capture = { path = "../pl-capture" }
pl-core = { path = "../pl-core" }
pl-project = { version = "0.1.0", path = "../pl-project" }
pl-reassembly = { path = "../pl-reassembly" }
rust-embed = { version = "8.13.0", features = ["interpolate-folder-path"] }
serde = "1.0.229"
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net", "signal", "time", "fs", "io-util"] }
tracing = "0.1.44"
utoipa-swagger-ui = { version = "10.0.1", features = ["axum", "vendored"], optional = true }

[dev-dependencies]
http-body-util = "0.1.5"
pl-hostile = { path = "../pl-hostile" }
serde-saphyr = "1.3.0"
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["macros", "rt", "rt-multi-thread"] }
tower = "0.5.3"

[features]
dev-tools = ["dep:utoipa-swagger-ui"]
