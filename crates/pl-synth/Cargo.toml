[package]
name = "pl-synth"
description = "Генератор синтетических записей трафика с дефектами захвата"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"

[dev-dependencies]
etherparse = "0.21.0"
pcap-parser = "0.17.0"
