[workspace]
resolver = "3"
members = ["crates/pl-analysis", "crates/pl-report", "crates/pl-actions", "crates/pl-verify", "crates/pl-interp", "crates/pl-hostile", "crates/pl-stand", "crates/pl-project", "crates/pl-app", "crates/pl-capture", "crates/pl-core", "crates/pl-reassembly", "crates/pl-server", "crates/pl-synth", "crates/protoledger"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
