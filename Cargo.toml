[workspace]
resolver = "3"
members = ["crates/pl-core", "crates/pl-server", "crates/pl-synth", "crates/protoledger"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
