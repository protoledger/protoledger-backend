# Ключ ответов: интерпретация протокола стенда (см. README.md). Продукт её не использует сам —
# это пример описания и вход для тестов применения.
format: protoledger/interpretation@1
scope:
  direction: any
  filter: "dst_port == 4710 || src_port == 4710"
framing:
  kind: length_prefixed
  length: { at: 4, type: u16le, adjust: 7 }
  status: rule
messages:
  - id: read_param_req
    when: "type == 0x01"
    fields:
      - { name: signature, at: 0, type: bytes, len: 2, expect: "5ac3", status: rule }
      - { name: type, at: 2, type: u8, status: rule }
      - { name: session, at: 3, type: u8, status: rule }
      - { name: length, at: 4, type: u16le, status: rule }
      - { name: param, at: 6, type: u8, status: hypothesis, hypothesis: H1 }
      - { name: checksum, at: end-1, type: u8, status: rule }
  - id: read_param_resp
    when: "type == 0x81"
    fields:
      - { name: signature, at: 0, type: bytes, len: 2, expect: "5ac3", status: rule }
      - { name: type, at: 2, type: u8, status: rule }
      - { name: session, at: 3, type: u8, status: rule }
      - { name: length, at: 4, type: u16le, status: rule }
      - { name: param, at: 6, type: u8, status: hypothesis, hypothesis: H1 }
      - { name: value, at: 7, type: i32be, status: hypothesis, hypothesis: H2 }
      - { name: checksum, at: end-1, type: u8, status: rule }
  - id: set_param_req
    when: "type == 0x02"
    fields:
      - { name: signature, at: 0, type: bytes, len: 2, expect: "5ac3", status: rule }
      - { name: type, at: 2, type: u8, status: rule }
      - { name: session, at: 3, type: u8, status: rule }
      - { name: length, at: 4, type: u16le, status: rule }
      - { name: param, at: 6, type: u8, status: hypothesis, hypothesis: H1 }
      - { name: value, at: 7, type: i32be, status: hypothesis, hypothesis: H2 }
      - { name: checksum, at: end-1, type: u8, status: rule }
  - id: set_param_resp
    when: "type == 0x82"
    fields:
      - { name: signature, at: 0, type: bytes, len: 2, expect: "5ac3", status: rule }
      - { name: type, at: 2, type: u8, status: rule }
      - { name: session, at: 3, type: u8, status: rule }
      - { name: length, at: 4, type: u16le, status: rule }
      - { name: param, at: 6, type: u8, status: hypothesis, hypothesis: H1 }
      - { name: result, at: 7, type: u8, status: hypothesis, hypothesis: H4 }
      - { name: applied, at: 8, type: i32be, status: hypothesis, hypothesis: H2 }
      - { name: checksum, at: end-1, type: u8, status: rule }
  - id: measure_req
    when: "type == 0x03"
    fields:
      - { name: signature, at: 0, type: bytes, len: 2, expect: "5ac3", status: rule }
      - { name: type, at: 2, type: u8, status: rule }
      - { name: session, at: 3, type: u8, status: rule }
      - { name: length, at: 4, type: u16le, status: rule }
      - { name: channel, at: 6, type: u8, status: hypothesis, hypothesis: H3 }
      - { name: checksum, at: end-1, type: u8, status: rule }
  - id: measure_resp
    when: "type == 0x83"
    fields:
      - { name: signature, at: 0, type: bytes, len: 2, expect: "5ac3", status: rule }
      - { name: type, at: 2, type: u8, status: rule }
      - { name: session, at: 3, type: u8, status: rule }
      - { name: length, at: 4, type: u16le, status: rule }
      - { name: channel, at: 6, type: u8, status: hypothesis, hypothesis: H3 }
      - { name: count, at: 7, type: u16le, status: rule }
      - { name: samples, at: 9, type: bytes, len: "count * 2", status: hypothesis, hypothesis: H5 }
      - { name: checksum, at: end-1, type: u8, status: rule }
  - id: error
    when: "type == 0xff"
    fields:
      - { name: signature, at: 0, type: bytes, len: 2, expect: "5ac3", status: rule }
      - { name: type, at: 2, type: u8, status: rule }
      - { name: session, at: 3, type: u8, status: rule }
      - { name: length, at: 4, type: u16le, status: rule }
      - { name: code, at: 6, type: u8, status: hypothesis, hypothesis: H6 }
      - { name: text, at: 7, type: string, len: "length - 1", status: hypothesis, hypothesis: H6 }
      - { name: checksum, at: end-1, type: u8, status: rule }
hypotheses:
  - { id: H1, statement: "param — идентификатор параметра (1 уставка, 2 усиление, 3 режим)" }
  - { id: H2, statement: "value и applied — значение параметра, знаковое 32 бита, старший байт первым", test: "value == action.params.value" }
  - { id: H3, statement: "channel — номер канала измерения" }
  - { id: H4, statement: "result — статус записи: 0 принято, 1 вне диапазона" }
  - { id: H5, statement: "samples — отсчёты i16, старший байт первым" }
  - { id: H6, statement: "code и text — код и текст ошибки" }
checks:
  - { id: C1, kind: structural, expr: "length + 7 == message.len", description: "длина в заголовке не совпадает с размером сообщения" }
  - { id: C2, kind: structural, expr: "checksum == sum8(0, message.len - 1)", description: "контрольная сумма не сходится" }
