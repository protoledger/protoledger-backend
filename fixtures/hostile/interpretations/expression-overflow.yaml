format: protoledger/interpretation@1
framing: { kind: length_prefixed, length: { at: 2, type: u16be, adjust: 4 } }
messages:
  - id: m
    fields:
      - { name: a, at: 0, type: u8 }
checks:
  - { id: C1, expr: "a / 0 == 1" }
  - { id: C2, expr: "170141183460469231731687303715884105727 * 2 > a" }
  - { id: C3, expr: "sum8(0, 18446744073709551615) == 0" }
  - { id: C4, expr: "sum8(5, 1) == 0" }
