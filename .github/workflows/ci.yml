name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Формат заголовка PR
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf '%s' "$TITLE" | grep -qE '^(feat|fix|refactor|perf|test|docs|build|ci|chore|style|revert)(\([a-z0-9._/-]+\))?!?: .+' \
            || { echo "Заголовок PR: <тип>(<скоуп>): <описание по-русски>"; exit 1; }
          printf '%s' "$TITLE" | grep -qP '\p{Cyrillic}' || { echo "Описание в заголовке PR — по-русски"; exit 1; }

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Есть ли код
        id: ready
        run: if [ -f Cargo.toml ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "Cargo.toml ещё нет — пропускаю"; echo "ok=false" >> "$GITHUB_OUTPUT"; fi
      - uses: dtolnay/rust-toolchain@stable
        if: steps.ready.outputs.ok == 'true'
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        if: steps.ready.outputs.ok == 'true'
      - name: Форматирование
        if: steps.ready.outputs.ok == 'true'
        run: cargo fmt --all --check
      - name: Линтер
        if: steps.ready.outputs.ok == 'true'
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: tshark для сверки собранных потоков
        if: steps.ready.outputs.ok == 'true'
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends tshark
      - name: Тесты
        if: steps.ready.outputs.ok == 'true'
        env:
          PL_REQUIRE_TSHARK: "1"
        run: cargo test --all-features --locked

  desktop:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - name: Есть ли крейт
        id: ready
        run: if [ -f crates/protoledger-desktop/Cargo.toml ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "ok=false" >> "$GITHUB_OUTPUT"; fi
      - name: Системные библиотеки WebView
        if: steps.ready.outputs.ok == 'true'
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        if: steps.ready.outputs.ok == 'true'
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        if: steps.ready.outputs.ok == 'true'
        with:
          workspaces: crates/protoledger-desktop
      - name: Настольное приложение — формат, линтер, тесты
        if: steps.ready.outputs.ok == 'true'
        working-directory: crates/protoledger-desktop
        run: |
          cargo fmt --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked

  api-doc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: openapi.yaml ↔ API.md
        run: bash scripts/check-api-doc.sh

  ci:
    if: always()
    needs: [pr-title, rust, desktop, api-doc]
    runs-on: ubuntu-latest
    steps:
      - name: Итог
        run: |
          for r in "${{ needs.pr-title.result }}" "${{ needs.rust.result }}" "${{ needs.desktop.result }}" "${{ needs.api-doc.result }}"; do
            case "$r" in success|skipped) ;; *) echo "есть упавшие проверки: $r"; exit 1 ;; esac
          done
